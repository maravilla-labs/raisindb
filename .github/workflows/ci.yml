name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'book/**'
      - 'book.toml'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'book/**'
      - 'book.toml'

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Must MATCH rust-toolchain.toml, and must be present: this action rejects
      # a missing `toolchain` outright ("'toolchain' is a required input"), so it
      # cannot be omitted to let the pin speak for itself.
      #
      # It said `1.89.0` before, which was never the version that ran — cargo
      # honours the pin, and the CI log shows it syncing 1.94.1. A workflow naming
      # a version it does not use makes a formatting failure look like
      # local-vs-CI rustfmt drift, and sends whoever investigates chasing a
      # difference that does not exist. Keep the two in step when bumping.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.1
          components: rustfmt
      - run: cargo fmt --all -- --check
