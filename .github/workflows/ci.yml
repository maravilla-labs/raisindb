name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'book/**'
      - 'book.toml'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'book/**'
      - 'book.toml'

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Must MATCH rust-toolchain.toml, and must be present: this action rejects
      # a missing `toolchain` outright ("'toolchain' is a required input"), so it
      # cannot be omitted to let the pin speak for itself.
      #
      # It said `1.89.0` before, which was never the version that ran — cargo
      # honours the pin, and the CI log shows it syncing 1.94.1. A workflow naming
      # a version it does not use makes a formatting failure look like
      # local-vs-CI rustfmt drift, and sends whoever investigates chasing a
      # difference that does not exist. Keep the two in step when bumping.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.1
          components: rustfmt
      - run: cargo fmt --all -- --check

  adapters:
    name: Adapter suites
    runs-on: ubuntu-latest
    # The builtin adapters are JavaScript, so nothing in the Rust jobs runs them
    # — and until this step existed, nothing anywhere did. google-calendar's
    # adapter suite sat DEAD for months behind a loader that threw before the
    # first assertion (`new Function` cannot evaluate an ES module), reporting a
    # failure nobody was watching for. A test that no job runs is documentation
    # with a misleading file extension.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # `find -exec` with a failing command sets the exit status only with `+`
      # batching on some shells, so the loop reports per-file and fails the job
      # explicitly. Printing each file is the point: a suite that vanishes from
      # the list is the failure this step exists to catch, and a silent pass over
      # zero files would look identical to success.
      - name: Run every builtin adapter suite
        run: |
          set -uo pipefail
          status=0
          count=0
          while IFS= read -r f; do
            count=$((count + 1))
            echo "── $f"
            node --test "$f" || status=1
          done < <(find builtin-packages -name '*.test.mjs' | sort)
          echo "ran $count suite(s)"
          if [ "$count" -eq 0 ]; then
            echo "no adapter suites found — the glob is wrong, which is worse than a red test" >&2
            exit 1
          fi
          exit $status

  wasm-sdks:
    name: WebAssembly SDKs
    runs-on: ubuntu-latest
    # Three guest SDKs (Rust, Go, TypeScript) whose ONLY shared contract is the
    # WIT file and the generated bindings. Nothing else in CI compiles them, and
    # a drift between the registry and a generated SDK is invisible until a user
    # builds a component — so this job runs the native suites plus the freshness
    # tests that assert the committed output still matches the registry.
    #
    # Componentizing (wasm32-wasip2 / TinyGo / jco) stays a local `make` step:
    # it needs three more toolchains and the artifacts it produces are build
    # output, not something CI has to prove on every push.
    steps:
      - uses: actions/checkout@v4

      # Must MATCH rust-toolchain.toml — see the note in the Format job.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.1

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The wasm runtime + the generator's freshness tests
      # (`generated_sdk_bindings_are_fresh`, `sdk_wit_copies_match_source`,
      # `ts_sdk_api_wrapper_is_fresh`) live in the same lib test binary.
      - name: raisin-functions unit tests (wasm feature)
        run: cargo test -p raisin-functions --lib --features wasm

      - name: Install the TypeScript SDK's dependencies
        run: pnpm install --filter @raisindb/function-wasm...

      # STRICT turns a missing toolchain into a failure: every one of the three
      # is installed above, so a "skipped" line here means a suite silently
      # stopped running, which is what this job exists to catch.
      - name: Guest SDK suites
        run: make wasm-sdks-test
        env:
          WASM_SDKS_STRICT: '1'
