node_type: raisin:Function
properties:
  title: Handle Chat Message
  description: >
    Delivers chat messages from a person's outbox: to one recipient (user, agent
    or visitor), or to every member and moderator of a circle (group chat), each
    into their own inbox. Enforces the rules of /config/messaging (permissions,
    blocks, max_message_length, rate_limit_messages_per_minute) and checks
    attachments against the conversation's folder.
  language: javascript
  entry_file: index.js:handle_chat
  execution_mode: Async
  enabled: true
  resource_limits:
    timeout_ms: 60000
    max_memory_bytes: 33554432
  input_schema:
    type: object
    required:
      - node
    properties:
      node:
        type: object
        description: The chat message node
      event:
        type: object
        description: The trigger event metadata
  output_schema:
    type: object
    properties:
      success:
        type: boolean
      inbox_message_path:
        type: string
        description: Path to the inbox message created for recipient
      error:
        type: string
