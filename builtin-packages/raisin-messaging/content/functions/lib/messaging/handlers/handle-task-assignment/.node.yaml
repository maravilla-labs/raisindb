node_type: raisin:Function
properties:
  title: Handle Task Assignment
  description: >
    A person assigns a task through their outbox (message_type task_assignment):
    to one person (held to task_permissions of /config/messaging) or to a whole
    circle (held to the circle's messaging.tasks policy), where every member gets
    the task in their own inbox and a system-only record holds the completion
    policy (any, all, quorum). The sender is the outbox's home, never a field.
  language: javascript
  entry_file: index.js:handle_task_assignment
  execution_mode: Async
  enabled: true
  resource_limits:
    timeout_ms: 60000
    max_memory_bytes: 33554432
  input_schema:
    type: object
    required:
      - node
    properties:
      node:
        type: object
        description: The task assignment message node
      event:
        type: object
        description: The trigger event metadata
  output_schema:
    type: object
    properties:
      success:
        type: boolean
      inbox_task_path:
        type: string
        description: Path to the inbox task created
      notification_path:
        type: string
        description: Path to the notification created
      error:
        type: string
