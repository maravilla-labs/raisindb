node_type: raisin:Function
properties:
  title: Google Calendar Default Mapper
  description: >
    Default mapping function for Google Calendar mounts. Maps each event to a
    raisin:Event node, hoisting start/end/all_day/location/attendees/organizer/
    recurrence/status/url/calendar_id into typed properties. Pure and
    side-effect-free: called once per external item in the sync hot loop;
    performs no I/O. Returns null for cancelled events so they are skipped.
  language: javascript
  entry_file: index.js:handler
  execution_mode: Async
  enabled: true
  version: 1
  resource_limits:
    timeout_ms: 5000
    max_memory_bytes: 16777216
  input_schema:
    type: object
    required:
      - external_item
    properties:
      external_item:
        type: object
        description: The normalized ExternalItem to map
      mount:
        type: object
        description: Read-only mount snapshot { mount_id, mount_path, sync_config }
  output_schema:
    type: object
    description: "{ node_type, name?, properties } or null to skip the item"
    properties:
      node_type:
        type: string
      name:
        type: string
      properties:
        type: object
