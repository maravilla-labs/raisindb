node_type: raisin:Integration
properties:
  title: Google Calendar
  provider_type: google-calendar
  docs_url: https://developers.google.com/calendar/api/guides/overview
  setup_instructions: |
    ## Connect Google Calendar (Experimental)

    1. Open the [Google Cloud console](https://console.cloud.google.com/) and
       create (or pick) a project.
    2. Under **APIs & Services → Library**, enable the **Google Calendar API**.
    3. Configure the **OAuth consent screen**, then **Credentials → Create
       credentials → OAuth client ID**, type **Web application**.
    4. Under **Authorized redirect URIs**, add the **Redirect URI shown above**
       in this editor, then save.
    5. Copy the **Client ID** and **Client secret** into the fields on this page.
       The secret is encrypted at rest and never stored in cleartext.
    6. Decide the scopes BEFORE connecting. The template ships two:
       `calendar.readonly` and `calendar.events`.
       * `calendar.readonly` alone gives a **read-only** mount, and is enough
         for browsing the calendar list in the mount editor.
       * `calendar.events` is what a **mirror** mount (create / edit / delete)
         and an **RSVP** need. Without it every write returns 403 and the
         adapter reports a `config_error` naming this scope.
       Google issues a widened scope on **fresh consent only**, so an account
       connected before a scope was added must be **reconnected** — re-running
       sync will not upgrade it.
    7. Click **Connect account** and grant access, then create a mount. Pick the
       calendar from the list — `browse` reads your calendarList, so there is no
       calendar id to type.
    8. For RSVPs, add a SECOND mount beside the calendar one, conventionally
       `/calendar/rsvp`, with `write_config.mode: submit` and the **Google
       Calendar Outbox Mapper**. It holds `raisin:CalendarAction` nodes; nothing
       is sent until one is moved to `queued`. It is a separate mount on
       purpose: an RSVP notifies the organizer, so it must not be reachable by
       an ordinary property edit on an event.

    **Push:** automatic. The engine registers a Calendar `events.watch` channel
    for you when a mount uses `mode: webhook` or `hybrid` — no manual webhook.
  # Adapter path inside the `functions` workspace (see content/functions/adapters).
  adapter_function: /adapters/google-calendar
  # Disabled until an operator supplies client_id/client_secret via the admin
  # console. The client secret is NEVER stored here — the console encrypts it
  # into client_secret_encrypted (AES-256-GCM) on the node.
  # Experimental / preview connector (marked in the package title) — validate
  # against your own Google account before relying on it in production.
  enabled: false
  oauth_config:
    auth_url: https://accounts.google.com/o/oauth2/v2/auth
    token_url: https://oauth2.googleapis.com/token
    # Least-privilege default: read-only access to calendars and their events.
    # `calendar.events` is the write scope: a mirror mount creates, edits and
    # deletes events with it. Without it every push is a 403 and the adapter
    # reports a config_error naming this scope. Read-only alone cannot be
    # upgraded silently — Google issues a widened scope on fresh consent only,
    # so an existing connection must be reconnected after this changes.
    scopes:
      - https://www.googleapis.com/auth/calendar.readonly
      - https://www.googleapis.com/auth/calendar.events
    # Filled in by the admin console to match the deployment's callback URL,
    # e.g. https://<host>/api/integrations/<repo>/oauth/callback
    # The <repo> segment is REQUIRED and the path must end in /callback --
    # that is the only route the callback is registered on. Leave blank and
    # the server derives it from RAISINDB_BASE_URL.
    redirect_uri: ""
    # Request a refresh token and force the consent screen so offline sync works.
    access_type: offline
    prompt: consent
  # No connected_accounts, client_id, or client_secret_encrypted are shipped.
