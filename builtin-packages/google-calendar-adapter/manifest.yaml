name: google-calendar-adapter
version: 1.0.0
title: Google Calendar Adapter (Experimental)
description: >
  Experimental virtual-node adapter for Google Calendar. Mount a calendar into a
  workspace path and RaisinDB keeps its events in sync as raisin:Event nodes.
  Ships the Calendar v3 adapter function, a default mapping function, and a
  pre-configured (disabled) raisin:Integration template you complete with your
  own Google OAuth client in the admin console. Preview feature — validate
  against your own account before relying on it in production.
author: RaisinDB Team
license: BSL-1.1
icon: calendar
color: "#1a73e8"
keywords:
  - google-calendar
  - integration
  - virtual-nodes
  - sync
  - adapter
  - experimental
# Discovery contract for the admin console's Integrations gallery.
category: integrations

# Built-in package flag - embedded and available for manual install.
builtin: true
# Opt out of boot-time auto-install into every repo; install manually
# from the Integrations gallery once the target repo can accept it.
auto_install: false

provides:
  functions:
    - /functions/adapters/google-calendar
    - /functions/mappers/google-calendar-default
  # Pre-configured integration template (disabled until credentials are supplied).
  content:
    - raisin:system/integrations/google-calendar

# Sync configuration for package updates
# Defines which paths this package owns to prevent conflicts with other packages
sync:
  defaults:
    mode: merge
    on_conflict: prefer_server

  filters:
    # Adapter + mapper functions
    - root: /adapters/google-calendar
      include:
        - "**"
      mode: merge
    - root: /mappers/google-calendar-default
      include:
        - "**"
      mode: merge

    # Integration template in the system workspace
    # skip, NOT merge. This node is the operator's LIVE connector config: it holds
    # client_id, the encrypted client secret, connected_accounts and the tenant
    # authority. `merge` re-applied the shipped template over it and reset every
    # one of those to the packaged defaults — observed in production as a
    # configured Microsoft connector reverting to client_id: "", no secret, zero
    # accounts and auth_url back to `common`, which silently killed every mount
    # that depended on it. `skip` is documented for exactly this ("preserve
    # tenant-owned content across updates"): the template lands once, on first
    # install, and is never written again.
    #
    # Deliberately scoped to the integration node only. The adapter and mapper
    # functions above stay `merge` — those are OUR code and MUST keep updating,
    # which is what gets a connector fix to a running deployment.
    - root: /integrations/google-calendar
      workspace: raisin:system
      include:
        - "**"
      mode: skip

# Workspace configuration for auto-created folders
workspace_patches:
  functions:
    default_folder_type: raisin:Folder
  "raisin:system":
    default_folder_type: raisin:Folder
    allowed_node_types:
      add:
        - raisin:Integration
        - raisin:VirtualMount
