name: raisin:McpServer
title: MCP Server
description: >
  Declares a Model Context Protocol (MCP) server as content. Each node defines
  one MCP endpoint: its identity, the data policy governing the auto-generated
  data tools, and any custom tools that map to raisin:Function nodes. The MCP
  engine reads these property names verbatim to assemble the live tool set.
icon: plug
color: "#0EA5E9"

properties:
  - name: name
    title: Name
    type: string
    required: true
    description: Stable server name advertised during MCP initialization.

  - name: slug
    title: Slug
    type: string
    required: true
    unique: true
    description: URL-friendly identifier used to route requests to this server.

  - name: version
    title: Version
    type: string
    default: "1.0.0"
    description: Server version string advertised during MCP initialization.

  - name: instructions
    title: Instructions
    type: string
    description: >
      Natural-language usage instructions surfaced to the connecting client or
      agent during initialization.
    ui:
      widget: textarea
      rows: 6

  - name: public
    title: Public
    type: boolean
    default: false
    description: >
      Whether the server is reachable without authentication. When false the
      caller must be authenticated. Note: if anonymous access is enabled for the
      repository, an unauthenticated request resolves to the anonymous principal,
      which still satisfies a non-public server that declares no `scopes`. To
      restrict a non-public server to specific callers, declare `scopes` the
      anonymous role does not hold (data tools remain row-level-security scoped
      to the caller regardless).

  - name: scopes
    title: Scopes
    type: array
    items:
      type: string
    description: >
      Scopes a caller must hold to open the server at all. Each scope is a role
      or group id from raisin:access_control. On a non-public server, declaring
      scopes is the reliable way to gate access — the anonymous role will not
      hold a custom scope, so anonymous callers are rejected.

  - name: data
    title: Data Policy
    type: object
    description: >
      Governs which workspaces, operations, and resources the auto-generated
      data tools may touch.
    structure:
      workspaces:
        type: array
        items:
          type: string
        description: Workspaces whose nodes the data tools may operate on.
      operations:
        type: array
        items:
          type: string
        description: >
          Enabled data operations. One built-in tool is generated per entry.
          Allowed values - query_nodes, get_node, search_nodes, create_node,
          update_node, delete_node, list_workspaces.
      resources:
        type: boolean
        description: Whether raisin:// resources are exposed for the workspaces above.

  - name: ui_resources
    title: UI Resources
    type: array
    description: >
      Widgets declared once and referenced by name from a tool's
      `ui: { resource: <id> }`. MCP Apps (SEP-1865) scopes csp, permissions and
      domain to the RESOURCE - they describe the document, not the call that
      opened it - so several tools sharing one SPA describe ONE resource and
      must agree. Declaring the widget here is how they agree; declared inline
      per tool, three copies drift and the engine silently serves whichever the
      registry ordered first. A server may declare any number of widgets.
    items:
      type: object
      properties:
        id:
          type: string
          description: >
            Name tools reference from their `ui` block's `resource` field.
        entry:
          type: string
          description: Workspace-relative path to the widget's entry document.
        workspace:
          type: string
          description: Workspace the entry path resolves in.
        name:
          type: string
          description: Display name for the ui:// resource in resources/list.
        description:
          type: string
          description: Description of the UI resource.
        prefersBorder:
          type: boolean
          description: Whether the host should draw a border and background.
        baseHref:
          type: boolean
          description: See the same field under a tool's `ui`.
        domain:
          type: string
          description: See the same field under a tool's `ui`.
        permissions:
          type: object
          description: See the same field under a tool's `ui`.
        csp:
          type: object
          description: See the same field under a tool's `ui`.

  - name: tools
    title: Custom Tools
    type: array
    description: >
      Custom tools the server exposes, each mapping to a raisin:Function node.
    items:
      type: object
      properties:
        function:
          type: string
          description: >
            PATH of the raisin:Function node to invoke, in the functions
            workspace - e.g. /lib/studio/mcp-list-stories. Used verbatim as one
            direct read. This is a path, not a name: a name resolved by listing
            every raisin:Function node in the workspace and linear-searching it,
            on every single tool call, so invoking one tool got slower for
            everyone each time a package shipped another function.
        name:
          type: string
          description: Tool name advertised to clients.
        description:
          type: string
          description: Human-readable description of what the tool does.
        inputSchema:
          type: object
          description: JSON Schema describing the accepted argument object.
        outputSchema:
          type: object
          description: >
            JSON Schema describing the tool's structured result. Usually leave
            this unset - it is inherited from the referenced raisin:Function
            node's output_schema, which is where a schema belongs. Set it here
            only to override the function's for this one tool. What matters is
            that a schema exists on ONE of the two: with neither, the result
            carries only a text content block, so a ui-bound widget receives no
            structuredContent and renders empty. That is the most common
            authoring mistake. Same inheritance applies to inputSchema and
            description.
        scopes:
          type: array
          items:
            type: string
          description: Scopes a caller must hold to invoke this tool.
        ui:
          type: object
          description: >
            Optional MCP-UI binding. When set, the host renders a widget
            alongside the tool result.
          properties:
            resource:
              type: string
              description: >
                Name of a `ui_resources` entry to use as this tool's widget -
                the alternative to spelling `entry` and the resource metadata
                out here. Fields set inline still override the resource's, so a
                tool can narrow a shared widget without restating it. A typo
                warns and leaves the tool callable without a widget rather than
                failing the server.
            mode:
              type: string
              description: >
                DEPRECATED - do not set on new bindings. MCP Apps (SEP-1865)
                defines exactly one delivery format, inline HTML with mimeType
                text/html;profile=mcp-app, and lists external URLs
                (text/uri-list) as deferred from the MVP - which is why a
                uri-list widget arrived at ChatGPT as a bare url instead of
                rendering. A widget is now delivered inline whatever this says.
                Still accepted so deployed nodes keep parsing. Its one residual
                effect - uri-list widgets were served same-origin, so it
                defaults baseHref on. Allowed values - html, uri-list.
            entry:
              type: string
              description: >
                Workspace-relative path to the widget's entry document. The
                document must be a single self-contained HTML5 file - the spec
                has no multi-file delivery, so bundle scripts and styles inline.
                A #fragment is accepted and IGNORED: it names an in-app route,
                and a route is not a different resource. Which view the widget
                boots into comes from the host at runtime (the instantiating
                tool's name, then the tool-input notification). Omit `entry`
                when using `resource`.
            baseHref:
              type: boolean
              description: >
                Whether to inject a <base href> pointing at the entry document's
                directory, so the widget's RELATIVE urls (images, fonts) keep
                resolving. Delivered inline, a widget runs on the host's sandbox
                origin, where a relative url resolves against the host and 404s.
                Defaults ON for a binding declaring the legacy mode: uri-list
                (written against same-origin serving) and OFF otherwise. The
                cost, and why it is not simply always on - with a <base>, a
                FRAGMENT-ONLY link (<a href="#/inbox">) resolves against the
                base url rather than the document, so a hash router built on
                anchors navigates away instead of switching view. Turn it on for
                relative assets; keep routing programmatic.
            workspace:
              type: string
              description: >
                Workspace the entry path resolves in. Defaults to the session's
                active workspace, which often cannot hold assets - a server
                whose primary workspace allows only document types keeps its
                widgets in a sibling asset workspace.
            name:
              type: string
              description: Display name for the ui:// resource in resources/list.
            description:
              type: string
              description: Description of the UI resource.
            visibility:
              type: array
              items:
                type: string
              description: >
                Who may call this tool - "model" (the agent) and/or "app" (the
                widget). Defaults to both per SEP-1865. NOT a security boundary,
                which is what scopes are for - the host enforces this, and a
                tool declaring scopes is defaulted to ["model"] so a privileged
                tool never becomes widget-callable by omission.
            prefersBorder:
              type: boolean
              description: >
                Whether the host should draw a border and background. Setting it
                explicitly is recommended - host defaults vary.
            domain:
              type: string
              description: >
                Stable sandbox origin the host should serve this widget from,
                as a bare hostname (e.g. abc123.claudemcpcontent.com). Hosts
                otherwise pick a per-conversation origin; a stable one is what
                makes OAuth callbacks and CORS/API-key allowlists possible. The
                format is host-specific, so leave unset unless the host
                documents a value - a wrong one is worse than none.
            permissions:
              type: object
              description: >
                Sandbox permissions the widget requests. Each granted member is
                an EMPTY OBJECT, not a boolean - {"camera": {}}. Recognised -
                camera, microphone, geolocation, clipboardWrite. Hosts may
                decline, so feature-detect rather than assuming a grant.
            csp:
              type: object
              description: >
                Origins the widget needs, which the host turns into its sandbox
                CSP. Lists - connectDomains (fetch/XHR/WebSocket),
                resourceDomains (scripts/styles/images/fonts/media),
                frameDomains (nested iframes), baseUriDomains. This server's own
                origin is added automatically. Omitting csp entirely means the
                host's restrictive default - no external network access at all.
