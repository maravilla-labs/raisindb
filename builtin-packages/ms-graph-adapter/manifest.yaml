name: ms-graph-adapter
version: 1.5.1
title: Microsoft 365 Adapter (Preview)
description: >
  EXPERIMENTAL virtual-node adapter for Microsoft 365 over Microsoft Graph v1.0.
  Mount an Outlook mail folder, a calendar, OneDrive or a SharePoint document
  library into a workspace path and RaisinDB keeps it in sync — messages become
  raisin:Mail nodes (fulltext on subject and body, indexed sender /
  conversation_id / message_id / date, so conversation grouping and sender
  filters are index-backed) and events become raisin:Event nodes. Set
  `principal` to sync a SHARED MAILBOX rather than the connected account's own,
  and `drive_scope: site` + a site id to sync a SharePoint library through the
  same files mapper. Set `include_body` on the connection or mount to sync full
  message bodies; it is off by default because bodies multiply delta payload
  size. Ships
  the Graph adapter function, a mail mapper and a calendar mapper, and a
  pre-configured (disabled) raisin:Integration template you complete with your
  own Microsoft Entra (Azure AD) OAuth app in the admin console.
author: RaisinDB Team
license: BSL-1.1
icon: mail
color: "#0078d4"
keywords:
  - microsoft-365
  - microsoft-graph
  - outlook
  - calendar
  - email
  - integration
  - virtual-nodes
  - sync
  - adapter
  - experimental
# Discovery contract for the admin console's Integrations gallery.
category: integrations

# Built-in package flag - embedded and available for manual install.
builtin: true
# Opt out of boot-time auto-install into every repo; install manually
# from the Integrations gallery once the target repo can accept it.
auto_install: false

provides:
  # Config schemas rendered by the admin console. `msgraph:` (no hyphen) because
  # NodeType names may not contain one; provider_type stays `ms-graph`.
  nodetypes:
    - msgraph:ConnectorConfig
    - msgraph:ConnectionConfig
  functions:
    - /functions/adapters/ms-graph
    - /functions/mappers/ms-graph-mail
    - /functions/mappers/ms-graph-calendar
    - /functions/mappers/ms-graph-files
    # The OUTBOX (write_config.mode: submit) mapper: raisin:OutboundMail and
    # raisin:CalendarAction -> the Graph request the adapter's `submit` issues.
    - /functions/mappers/ms-graph-outbox
    # Conflict resolver for a mail mount: point the mount's resolver_function
    # at it to decide per message what a refused push means, instead of the
    # default remote_wins (which discards the local edit silently).
    - /functions/resolvers/ms-graph-mail
  # Pre-configured integration template (disabled until credentials are supplied).
  content:
    - raisin:system/connectors/ms-graph

# Sync configuration for package updates
# Defines which paths this package owns to prevent conflicts with other packages
sync:
  defaults:
    mode: merge
    on_conflict: prefer_server

  filters:
    # Adapter + mapper functions
    - root: /adapters/ms-graph
      include:
        - "**"
      mode: merge
    - root: /mappers/ms-graph-mail
      include:
        - "**"
      mode: merge
    - root: /mappers/ms-graph-calendar
      include:
        - "**"
      mode: merge
    - root: /mappers/ms-graph-files
      include:
        - "**"
      mode: merge
    - root: /mappers/ms-graph-outbox
      include:
        - "**"
      mode: merge
    - root: /resolvers/ms-graph-mail
      include:
        - "**"
      mode: merge

    # NOTE: no filter for the connector template below.
    #
    # There used to be a `mode: skip` entry here protecting the operator's live
    # connector node, because a re-install replaced its whole property map and
    # wiped the client id, the encrypted secret and every connected account. It
    # never worked: nothing on the install path reads `manifest.sync` (only the
    # exporter does), install reads only a `.raisin-sync.yaml` at the zip root
    # which this package does not ship, `SyncFilter` has no `workspace` field so
    # that key was dropped by serde, and the root would not have matched anyway.
    #
    # The template now lives under `/connectors`, which packages own and may
    # overwrite freely, while operator instances live under `/integrations`,
    # which NO package declares. The protection is structural: install cannot
    # reach a path no package ships. Do not add a policy filter back.

# Workspace configuration for auto-created folders
workspace_patches:
  functions:
    default_folder_type: raisin:Folder
  "raisin:system":
    default_folder_type: raisin:Folder
    allowed_node_types:
      add:
        - raisin:Integration
        - raisin:VirtualMount
