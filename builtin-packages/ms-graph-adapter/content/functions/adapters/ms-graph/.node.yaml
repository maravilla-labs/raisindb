node_type: raisin:Function
properties:
  title: Microsoft 365 Adapter
  description: >
    EXPERIMENTAL virtual-node adapter for Microsoft 365 over Microsoft Graph v1.0.
    Translates the normalized adapter operations (capabilities, list, get,
    get_content, get_changes, update, subscribe, renew, unsubscribe) into Graph
    REST calls. The mount's sync_config.resource selects the surface ("mail" ->
    mailFolders/messages, "calendar" -> calendars/events + calendarView, "files" ->
    drive items + delta). `principal` selects WHOSE mailbox/calendar (blank = the
    connected account, an address = a shared mailbox), and for "files"
    `drive_scope` picks OneDrive or a SharePoint document library. Writes are
    declared PER RESOURCE: CALENDAR is a full mirror (create/update/delete) plus
    RSVP; MAIL supports `update` (a state PATCH of the read flag) plus
    send/reply/forward; FILES is read-only, because a Graph drive write is an
    upload session rather than a JSON body. A write needs a ReadWrite scope
    (Mail.ReadWrite / Calendars.ReadWrite) which the connector does not request
    by default — add it and re-consent per account, since Microsoft only issues a
    widened scope on fresh consent.
    Push-capable: subscribe/renew/unsubscribe manage a Graph subscription whose
    notifications are a pure invalidation signal. Invoked directly by the sync
    engine with a decrypted bearer token; owns no token-refresh logic.
  language: javascript
  entry_file: index.js:handler
  execution_mode: Async
  enabled: true
  # 2: the drive WRITE path (create/update/delete + finalize_upload).
  version: 2
  resource_limits:
    timeout_ms: 120000
    max_memory_bytes: 67108864
  # Outbound access is restricted to Microsoft Graph and the Microsoft identity
  # platform. `**` is required: `*` does not cross `/`, so it would not match
  # multi-segment Graph paths like /v1.0/me/mailFolders/inbox/messages.
  #
  # THE DRIVE WRITE PATH ADDS NOTHING HERE, and that is the design rather than an
  # omission. `createUploadSession` is an ordinary POST to graph.microsoft.com,
  # already covered. The session's own upload URL is a pre-authenticated
  # *.sharepoint.com host — the ENGINE streams the bytes to it in Rust, under the
  # operator's egress policy, exactly as it downloads a read's `fetch_url`. If
  # that host were listed here it would mean the adapter was uploading megabytes
  # through a QuickJS string, which is the thing the second call exists to avoid.
  network_policy:
    http_enabled: true
    request_timeout_ms: 120000
    max_concurrent_requests: 10
    allowed_urls:
      - "https://graph.microsoft.com/**"
      - "https://login.microsoftonline.com/**"
  input_schema:
    type: object
    required:
      - operation
    properties:
      operation:
        type: string
        description: >
          One of capabilities, list, get, get_content, get_changes, create
          (calendar + files), update (mail + calendar + files), delete
          (calendar + files), finalize_upload (files, after the engine streamed
          an upload session), submit, subscribe, renew, unsubscribe, browse
      params:
        type: object
        description: Operation-specific arguments
      credential:
        type: object
        description: Decrypted account credential { access_token, account_id, provider_type }
      mount:
        type: object
        description: >
          Read-only mount snapshot { mount_id, remote_root, mount_path,
          sync_config, api_config, config }. `config` is the resolved merge
          (api_config < connector < connection < sync_config) and is what the
          adapter reads; sync_config is the fallback for an older engine.
          Keys: resource (mail | calendar | files), principal (blank = the
          connected account, else a mailbox/UPN — this is how a SHARED MAILBOX
          is selected), drive_scope (me | user | site) with site_id/drive_id for
          a SharePoint library, include_body, and window { days_ahead,
          days_back } bounding the calendarView delta.
  output_schema:
    type: object
    description: Operation-specific result (ExternalItem, page, Capabilities, Change feed, ...)
