node_type: raisin:Function
properties:
  title: Microsoft 365 Calendar Mapper
  description: >
    Mapping function for Microsoft 365 calendar mounts. Maps each Graph event to a
    raisin:Event v2 — the provider-neutral shape the Google Calendar mapper also
    emits: UTC + local + IANA timezone, RFC 5545 recurrence lines, object
    attendees, and status / show_as / my_response split apart instead of Graph's
    single conflated string. Bidirectional dispatch on input.operation:
    to_external emits Graph-shaped event JSON for a mirror calendar mount and
    mapper_capabilities reports to_external:true. Three files — index.js holds
    the dispatch and the two field-by-field translations, while the two mappings
    that must stay EXACT INVERSES live one per file (time.js: naive wall clock +
    Windows zone <-> UTC/local/IANA; recurrence.js: patternedRecurrence <->
    RRULE), so a rule taught to one direction is taught beside the other. Pure
    and side-effect-free: called once per external item in the sync hot loop;
    performs no I/O.
  language: javascript
  entry_file: index.js:handler
  execution_mode: Async
  enabled: true
  # 3: the recurrence and time translations moved into sibling modules, one
  #    file per relationship, so the two directions of each cannot drift apart.
  version: 3
  resource_limits:
    timeout_ms: 5000
    max_memory_bytes: 16777216
  input_schema:
    type: object
    required:
      - external_item
    properties:
      external_item:
        type: object
        description: The normalized ExternalItem to map
      mount:
        type: object
        description: Read-only mount snapshot { mount_id, mount_path, sync_config }
  output_schema:
    type: object
    description: "{ node_type, name?, properties } or null to skip the item"
    properties:
      node_type:
        type: string
      name:
        type: string
      properties:
        type: object
