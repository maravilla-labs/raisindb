node_type: raisin:Function
properties:
  title: Microsoft 365 Files Mapper
  description: >
    Mapping function for Microsoft 365 (OneDrive / SharePoint) files mounts.
    to_node maps driveItem folders to raisin:Folder and files to raisin:Asset,
    using metadata.filename for the title (external_id/name are the Graph item
    id) and carrying provider metadata through. to_external emits the driveItem
    METADATA for a write — the name and the conflict behaviour (rename on create
    so a locally-born file never overwrites a stranger's, replace on update) —
    and never the bytes, which travel beside the payload as the engine's
    `content`. Bidirectional dispatch on input.operation; an absent operation
    means to_node. Pure and side-effect-free: called once per external item in
    the sync hot loop, and once per candidate in the write drain; performs no
    I/O.
  language: javascript
  entry_file: index.js:handler
  execution_mode: Async
  enabled: true
  version: 4
  resource_limits:
    timeout_ms: 5000
    max_memory_bytes: 16777216
  input_schema:
    type: object
    properties:
      operation:
        type: string
        description: >
          to_node (the default when absent), to_external, or
          mapper_capabilities
      external_item:
        type: object
        description: The normalized ExternalItem to map (to_node)
      node:
        type: object
        description: The node being pushed (to_external)
      fields:
        type: array
        description: Node property names this push may carry (to_external)
      intent:
        type: string
        description: create or update (to_external)
      mount:
        type: object
        description: Read-only mount snapshot { mount_id, mount_path, sync_config }
  output_schema:
    type: object
    description: >
      to_node: { node_type, name?, properties } or null to skip the item.
      to_external: { payload } or null to decline the push."
    properties:
      node_type:
        type: string
      name:
        type: string
      properties:
        type: object
