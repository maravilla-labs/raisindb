name: msgraph:ConnectionConfig
description: >
  Per-connection settings for one Microsoft 365 connection. Holding the
  directory (tenant) id here is what lets a single Microsoft connector serve
  several Entra tenants side by side.
extends: raisin:ConnectionConfig
version: 1

strict: false
indexable: false
versionable: false
publishable: false
auditable: false

# NOTE the type name is `msgraph:`, not `ms-graph:` — NodeType names must match
# ^[a-zA-Z]+:(?:[A-Z][a-z]*)+$, which allows no hyphens. The connector's
# provider_type stays `ms-graph`; only the schema type name differs.
properties:
  - name: tenant_id
    type: String
    required: false
    meta:
      label: Directory (tenant) ID
      description: >
        The Entra directory this connection signs into. Leave blank to use the
        connector's configured authority. Microsoft rejects the shared `common`
        authority for single-tenant app registrations with AADSTS50194.
      placeholder: 00000000-0000-0000-0000-000000000000
      group: microsoft
      order: 10
      identity: true

  - name: resource
    type: String
    required: false
    default: mail
    meta:
      label: Default resource
      description: >
        Graph surface this connection targets when a mount does not say. A mount
        may override it.
      enum:
        - mail
        - calendar
        - files
      group: microsoft
      order: 20

  - name: principal
    type: String
    required: false
    meta:
      label: Mailbox / user (leave blank for the connected account)
      description: >
        Whose mailbox, calendar or OneDrive this connection reads. Blank means
        the signed-in account itself. Set it to a SHARED MAILBOX address to sync
        one — that needs `Mail.Read.Shared` / `Calendars.Read.Shared` on the app
        registration AND the connected account holding Full Access to the
        mailbox in Exchange. A mount may override it, so one connection can
        serve several shared mailboxes.
      placeholder: sales@contoso.com
      group: microsoft
      order: 15

  - name: drive_scope
    type: String
    required: false
    meta:
      label: Drive location (resource "files" only)
      description: >
        Which drive a files mount reads. `me` is the connected account's
        OneDrive; `user` is the OneDrive of the account named above (needs
        `Files.Read.All`); `site` is a SharePoint document library (needs
        `Sites.Read.All`). Left blank it is inferred — a site id means `site`, a
        mailbox/user means `user`, otherwise `me`.
      enum:
        - me
        - user
        - site
      group: microsoft
      order: 40

  - name: site_id
    type: String
    required: false
    meta:
      label: SharePoint site ID
      description: >
        Required when the drive location is `site`. The composite Graph site id,
        `hostname,siteGuid,webGuid` — read it from
        `GET /sites/{hostname}:/sites/{path}`.
      placeholder: contoso.sharepoint.com,00000000-...,00000000-...
      group: microsoft
      order: 41

  - name: drive_id
    type: String
    required: false
    meta:
      label: SharePoint document library (drive) ID
      description: >
        Which library within the site. Leave blank for the site's default
        document library, which is what most sites need.
      group: microsoft
      order: 42

  - name: include_body
    type: Boolean
    required: false
    default: false
    meta:
      label: Sync full message bodies
      description: >
        Fetch each message's full body during sync, so it lands on the node as
        `body` and is fulltext-indexed. Off by default: bodies are whole HTML
        documents and including them multiplies the size of every delta page, so
        a mailbox-sized mount gets substantially slower and heavier. Leave it off
        if the `snippet` preview is enough. A mount may override it.
      group: microsoft
      order: 30

allowed_children: []
