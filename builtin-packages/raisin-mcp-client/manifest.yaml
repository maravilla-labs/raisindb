name: raisin-mcp-client
version: 1.0.0
title: MCP Client
description: >
  Connect RaisinDB to external Model Context Protocol servers. Each
  raisin:McpConnection node describes one remote server; tool discovery
  materializes one raisin:Function proxy per remote tool under /mcp/{slug}/ in
  the functions workspace, which agents reference from their `tools:` array
  exactly like any local function.

  This is the OUTBOUND direction. The `raisin-mcp` package is the inbound one —
  it lets external clients call RaisinDB's own tools. The two are independent:
  a repo may run either, both, or neither.
author: RaisinDB Team
license: BSL-1.1
icon: plug-zap
color: "#0EA5E9"
keywords:
  - mcp
  - model-context-protocol
  - client
  - tools
  - agent

# Discovery contract for the admin console's Connectors gallery.
category: integrations

builtin: true
# This package ships NO content. It only patches raisin:system's allowed types,
# so `raisin:McpConnection` — a globally-registered node type — may be written
# there. Nothing reaches the network until an operator creates and enables a
# connection, so it is safe in every repo on boot.
#
# It deliberately ships no example connection. An earlier version did, and the
# example was a mistake twice over: `auto_install: true` put a phantom
# "example-linear" in EVERY repo's connection list, and the content lived at
# `content/mcp-connections/...` — where the first segment under `content/` is
# the WORKSPACE name, so every install failed with "Workspace 'mcp-connections'
# does not exist" and retried to exhaustion on each boot. The shape of a
# connection is documented in docs/MCP_CLIENT.md instead, where it costs nobody
# a node.
auto_install: true

workspace_patches:
  # Generated proxies live under /mcp/{slug}/ in the functions workspace, and
  # discovery creates those folders on demand.
  functions:
    default_folder_type: raisin:Folder
  "raisin:system":
    allowed_node_types:
      add:
        - raisin:McpConnection
