node_type: "raisin:Function"
properties:
  title: "Node Changeset"
  description: |
    Work with a proposed changeset by id: action=get (the record), commit (apply
    it; pass expected_digest to bind the commit to the reviewed digest),
    discard, or list (your changesets).
  execution_mode: "inline"
  category: "node-dev"
  enabled: true
  language: "javascript"
  entry_file: "index.js:handler"
  version: 1
  input_schema: {"type": "object", "properties": {"roots": {"type": "array", "description": "The subtrees you work in: [{workspace, path}] (path defaults to '/'). The first root is the base for relative paths; nothing outside the roots can be named. An agent run's own grant narrows these further.", "items": {"type": "object", "properties": {"workspace": {"type": "string"}, "path": {"type": "string"}}, "required": ["workspace"]}}, "workspace": {"type": "string", "description": "Shorthand for roots=[{workspace, path:'/'}]."}, "branch": {"type": "string", "description": "Branch to work on (default main). Develop on a draft branch from node-branch fork."}, "action": {"type": "string", "enum": ["get", "commit", "discard", "list"]}, "changeset_id": {"type": "string"}, "expected_digest": {"type": "string"}, "status": {"type": "string", "enum": ["proposed", "committed", "discarded"]}}, "required": ["action"]}
