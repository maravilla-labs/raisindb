node_type: raisin:Function
properties:
  name: resolve-delegation-review
  title: Resolve Delegation Review
  description: Records the authenticated review decision after a delegated branch is merged or discarded.
  execution_mode: inline
  category: planning
  enabled: true
  language: javascript
  entry_file: index.js:handler
  input_schema:
    type: object
    additionalProperties: false
    required: [task_id, plan_path, workspace, branch, action]
    properties:
      task_id: { type: string }
      plan_path: { type: string }
      workspace: { type: string }
      branch: { type: string }
      action:
        type: string
        enum: [merged, discarded]
