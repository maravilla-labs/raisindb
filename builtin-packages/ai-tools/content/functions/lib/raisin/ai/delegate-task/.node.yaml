node_type: raisin:Function
properties:
  name: delegate-task
  title: Delegate Plan Task
  description: >
    Delegate one approved plan task to an installed agent as a durable child
    run. Collect its result with wait_for_agents (or get_delegation_status);
    message or interrupt it while it works. Same as spawn_agent, keyed by task.
  execution_mode: inline
  execution_context: system
  category: planning
  # raisin:Function is strict; tool traits live in its declared metadata.
  metadata: { idempotent: true }
  enabled: true
  language: javascript
  entry_file: index.js:handler
  input_schema:
    type: object
    additionalProperties: false
    required: [task_id, agent_ref, objective]
    properties:
      task_id: { type: string, description: "ID of a task in the current conversation plan" }
      agent_ref: { type: string, description: "Installed agent path, for example /agents/security-reviewer" }
      objective: { type: string, description: "Bounded objective and expected result for the child agent" }
      context:
        type: object
        description: "Only the structured context the child needs"
      max_tool_iterations:
        type: integer
        minimum: 1
        maximum: 12
        default: 6
      independent:
        type: boolean
        description: "Required while another child still works: this task does not depend on it"
  output_schema:
    type: object
    properties:
      success: { type: boolean }
      delegation_id: { type: string }
      child_run_id: { type: string }
      task_id: { type: string }
      agent_ref: { type: string }
      status: { type: string }
