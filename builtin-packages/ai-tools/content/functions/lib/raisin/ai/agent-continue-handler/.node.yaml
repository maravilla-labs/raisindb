node_type: raisin:Function
properties:
  title: AI Agent Continue Handler
  description: Handles tool results and continues conversation with AI
  language: JavaScript
  entry_file: index.js:handleToolResult
  execution_mode: Async
  enabled: true
  resource_limits:
    timeout_ms: 120000
    max_memory_bytes: 268435456
  network_policy:
    http_enabled: true
    # `**`, NOT `*`. A single star does not cross `/`, so `host/*` matches the
    # root and nothing else — and every real path here is multi-segment
    # (`/v1/messages`, `/v1/chat/completions`, `/calendar/v3/...`). A request
    # refused by this list never leaves the sandbox and comes back with NO HTTP
    # status, which is unusually hard to diagnose.
    allowed_urls:
      - "https://api.openai.com/**"
      - "https://api.anthropic.com/**"
      - "http://localhost:11434/*"
