node_type: raisin:Flow
properties:
  title: Delegated Agent Task
  name: delegated-agent-task
  description: Runs one installed agent in an isolated branch and preserves its changes for review.
  enabled: true
  workflow_data:
    version: 1
    error_strategy: fail_fast
    nodes:
      - id: delegate
        node_type: raisin:FlowStep
        properties:
          step_type: ai_agent
          action: Run delegated agent
          agent_ref: "${input.agent_ref}"
          agent_workspace: functions
          prompt: |-
            ${input.objective}

            Work only on this bounded task. Return a concise result with what you inspected,
            what you changed, tests performed, and any unresolved risk.

            Context:
            ${input.context}
          include_context: input
          isolated_branch: true
          branch_merge_strategy: review
          max_tool_iterations: 6
          continue_on_fail: true
      - id: record-result
        node_type: raisin:FlowStep
        properties:
          action: Record delegated result
          function_ref:
            raisin:ref: /lib/raisin/ai/complete-delegation
            raisin:workspace: functions
          arguments:
            task_path: "${input.task_path}"
            chat_path: "${input.chat_path}"
            workspace: "${input.workspace}"
            delegation_id: "${input.delegation_id}"
            result: "${steps.delegate}"
            error: "${error}"
