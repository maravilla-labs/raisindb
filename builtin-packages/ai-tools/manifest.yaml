name: ai-tools
version: 1.0.36
title: AI Tools Package
description: >
  Provides AI-powered node types and tools for RaisinDB.
  Includes AI prompts, AI conversations, and AI-generated content types.
author: RaisinDB Team
license: MIT
icon: sparkles
color: "#00bcd4"
keywords:
  - ai
  - llm
  - prompt
  - conversation
  - generation
category: ai

# Built-in package flag - auto-installed on repository creation
builtin: true

provides:
  nodetypes:
    - raisin:AIPrompt
    - raisin:AIModel
    - raisin:AIAgent
    - raisin:AIThought
    - raisin:AITask
    - raisin:AIPlan
    - raisin:AIToolCall
    - raisin:AIToolResult
    - raisin:AIToolSingleCallResult
    - raisin:AIToolResultAggregator
    - raisin:AICostRecord
    - raisin:AICompaction
    - raisin:AgentUserContext
    - raisin:Skill
  workspaces:
    - ai
  functions:
    - /functions/lib/raisin/ai/agent-handler
    - /functions/lib/raisin/ai/create-plan
    - /functions/lib/raisin/ai/add-task
    - /functions/lib/raisin/ai/update-task
    - /functions/lib/raisin/ai/get-plan-status
    - /functions/lib/raisin/ai/delegate-task
    - /functions/lib/raisin/ai/get-delegation-status
    - /functions/lib/raisin/ai/remember
    - /functions/lib/raisin/ai/read-user-context
    - /functions/lib/raisin/ai/forget
    - /functions/lib/raisin/ai/weather
    - /functions/lib/raisin/ai/plan-approval-handler
    - /functions/lib/raisin/ai/search-documents
    - /functions/lib/raisin/ai/ask
    - /functions/lib/raisin/ai/graph-context
    - /functions/lib/raisin/ai/extract-entities
    - /functions/lib/raisin/ai/load-skill
    - /functions/lib/raisin/ai/request-conversation-stop
    - /functions/lib/raisin/ai/agent-run-reducer
    - /functions/lib/raisin/ai/agent-run-model-turn
    - /functions/lib/raisin/ai/agent-run-project
    - /functions/lib/raisin/ai/agent-run-control
    - /functions/lib/raisin/ai/spawn-agent
    - /functions/lib/raisin/ai/inspect-agent
    - /functions/lib/raisin/ai/message-agent
    - /functions/lib/raisin/ai/wait-for-agents
    - /functions/lib/raisin/ai/interrupt-agent
    - /functions/lib/raisin/ai/flow-agent-run
    # The node-development surface as agent tools (raisin.nodeDev.*)
    - /functions/lib/raisin/node-dev/node-stat
    - /functions/lib/raisin/node-dev/node-list
    - /functions/lib/raisin/node-dev/node-read
    - /functions/lib/raisin/node-dev/node-diff
    - /functions/lib/raisin/node-dev/node-watch
    - /functions/lib/raisin/node-dev/node-dry-run
    - /functions/lib/raisin/node-dev/node-propose
    - /functions/lib/raisin/node-dev/node-apply
    - /functions/lib/raisin/node-dev/node-changeset
    - /functions/lib/raisin/node-dev/node-branch

# Sync configuration for package updates
# Defines which paths this package owns to prevent conflicts with other packages
sync:
  defaults:
    mode: merge
    on_conflict: prefer_server

  filters:
    # AI agent functions
    - root: /functions/lib/raisin/ai
      include:
        - "agent-handler/**"
        - "agent-shared/**"
        - "create-plan/**"
        - "add-task/**"
        - "update-task/**"
        - "get-plan-status/**"
        - "delegate-task/**"
        - "get-delegation-status/**"
        - "remember/**"
        - "read-user-context/**"
        - "forget/**"
        - "weather/**"
        - "plan-approval-handler/**"
        - "search-documents/**"
        - "ask/**"
        - "graph-context/**"
        - "extract-entities/**"
        - "load-skill/**"
        - "request-conversation-stop/**"
        - "agent-run-reducer/**"
        - "agent-run-model-turn/**"
        - "agent-run-project/**"
        - "agent-run-control/**"
        - "spawn-agent/**"
        - "inspect-agent/**"
        - "message-agent/**"
        - "wait-for-agents/**"
        - "interrupt-agent/**"
        - "flow-agent-run/**"
      mode: merge

    # Node-development tools
    - root: /functions/lib/raisin/node-dev
      include:
        - "node-stat/**"
        - "node-list/**"
        - "node-read/**"
        - "node-diff/**"
        - "node-watch/**"
        - "node-dry-run/**"
        - "node-propose/**"
        - "node-apply/**"
        - "node-changeset/**"
        - "node-branch/**"
      mode: merge

    # Flow definitions
    - root: /functions/flows
      include:
        - "chat/**"
        - "ai-agent-handler/**"
      mode: merge

    # Agent home content in workspace ai
    - root: /ai/agents
      workspace: ai
      include:
        - "**"
      mode: merge

workspace_patches:
  functions:
    default_folder_type: raisin:Folder
    allowed_node_types:
      add:
        - raisin:AIAgent
        - raisin:Skill
  "raisin:access_control":
    allowed_node_types:
      add:
        - raisin:Conversation
        - raisin:Message
        - raisin:AIThought
        - raisin:AIPlan
        - raisin:AITask
        - raisin:AIToolCall
        - raisin:AIToolResult
        - raisin:AIToolSingleCallResult
        - raisin:AIToolResultAggregator
        - raisin:AICostRecord
  ai:
    default_folder_type: raisin:Folder
    allowed_node_types:
      add:
        - raisin:AIPrompt
        - raisin:Conversation
        - raisin:Message
        - raisin:AIModel
        - raisin:AIAgent
        - raisin:AIThought
        - raisin:AITask
        - raisin:AIPlan
        - raisin:AIToolCall
        - raisin:AIToolResult
        - raisin:AIToolSingleCallResult
        - raisin:AIToolResultAggregator
        - raisin:Notification
        - raisin:InboxTask
        - raisin:Folder
        - raisin:AgentUserContext
        - raisin:AICostRecord
        - raisin:AICompaction
  default:
    default_folder_type: raisin:Folder
    allowed_node_types:
      add:
        - raisin:AIPrompt
        - raisin:Conversation
        - raisin:Message
        - raisin:AIModel
        - raisin:AIAgent
        - raisin:AIThought
        - raisin:AITask
        - raisin:AIPlan
        - raisin:AIToolCall
        - raisin:AIToolResult
        - raisin:AIToolSingleCallResult
        - raisin:AIToolResultAggregator
        - raisin:AICostRecord
