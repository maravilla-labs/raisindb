name: raisin:AIAgent
title: AI Agent
description: AI agent definition with system prompt, tools, and rules
icon: bot
color: "#8B5CF6"

properties:
  - name: system_prompt
    title: System Prompt
    type: string
    required: true
    description: System message defining AI behavior
    ui:
      widget: textarea
      rows: 10

  - name: tools
    title: Tools
    type: array
    items:
      type: Reference
    description: References to raisin:Function nodes that the agent can use

  # SKILLS — instructions the agent loads ON DEMAND (raisin:Skill, the Agent
  # Skills / SKILL.md shape). The system prompt carries only an index line per
  # skill; the body is read through the builtin load-skill tool, which is offered
  # automatically whenever the agent has any skill and refuses one it was not
  # given. Same reference envelope as `tools:`.
  - name: skills
    title: Skills
    type: array
    items:
      type: Reference
    required: false
    description: >-
      References to raisin:Skill nodes this agent may load. Listed before the
      global skills, in this order; the first skill of a name wins.

  - name: global_skills
    title: Global Skills
    type: boolean
    default: true
    required: false
    description: >-
      Whether this agent also gets the global skills — functions:/local/skills
      (the installation's) and functions:/skills (what packages ship). false is
      the per-agent opt-out.

  # The agent's OWN contract, distinct from a step's.
  #
  # Neither is enforced at runtime — they are declarative, the way a function's
  # `input_schema` / `output_schema` are — but neither is decoration either:
  # `output_schema` is the DEFAULT `response_format` for every call that does
  # not set one (a step's own `response_format` still wins), and `input_schema`
  # is what an authoring UI reads to know what this agent expects to be given.
  - name: input_schema
    title: Input Schema
    type: object
    required: false
    description: >-
      JSON Schema for what this agent expects to be given. Advisory: read by
      authoring tools to validate and build a step's inputs, never enforced at
      call time.

  - name: output_schema
    title: Output Schema
    type: object
    required: false
    description: >-
      JSON Schema for what this agent answers with. Used as the default
      structured-output format for calls that do not set their own
      `response_format`, and as the default result shape for a chat step's
      `end_session` control tool.

  - name: rules
    title: Rules
    type: array
    items:
      type: string
    description: Additional behavioral rules for the agent

  - name: task_creation_enabled
    title: Task Creation Enabled
    type: boolean
    default: false
    description: Whether the agent can create and manage structured plans/tasks. When disabled, planning-category tools are filtered out even if listed in tools.

  # WHETHER THIS AGENT MAY CLOSE ITS OWN WORK ON ITS OWN WORD.
  #
  # Per-agent for the same reason `max_tool_rounds` is: a builder that persists
  # executable artifacts — automations, flows, functions, agents — needs evidence
  # before it may say "done", and an ordinary chat agent must be completely
  # unaffected. The default is the historical behaviour.
  #
  # With `require_verified_completion`, three things change and nothing else:
  #   * `update-task` refuses to mark a task `completed` when that task declares
  #     a build target and carries no verification record, answering
  #     {success:false, reason:'unverified', missing:[…]} — a result the model can
  #     act on, not an error;
  #   * a plan no longer auto-completes by counting the boxes the model ticked
  #     itself, when any of them claims an unverified build;
  #   * a terminal turn's outbox message and `conversation:done` payload carry the
  #     SERVER'S statement of the run's status, derived from persisted task state,
  #     and free text cannot override a stopped or unverified one.
  - name: finalize_policy
    title: Finalize Policy
    type: string
    default: none
    required: false
    description: |
      How completion claims by this agent are enforced:
      - none: (default) the agent's own word closes a task, as before.
      - require_verified_completion: a task that declares a build target needs a
        verification record (verification_ref + verification_hash + proof_level)
        before it may be completed, the plan will not auto-complete without one,
        and the server states the run's status on every terminal turn.
    ui:
      widget: select
      options:
        - label: None - the agent closes its own tasks
          value: none
        - label: Require Verified Completion - evidence before "done"
          value: require_verified_completion

  - name: thinking_enabled
    title: Thinking Enabled
    type: boolean
    default: true
    description: Show reasoning steps to user

  - name: execution_mode
    title: Task Execution Mode
    type: string
    default: automatic
    description: |
      Plan/task execution policy:
      - automatic: create and execute tasks immediately
      - approve_then_auto: require plan approval, then execute all tasks automatically
      - step_by_step: execute one task per continue signal
      - manual: no automatic task execution
    ui:
      widget: select
      options:
        - label: Automatic - execute tasks immediately
          value: automatic
        - label: Approve Then Auto - approve plan, then run all tasks
          value: approve_then_auto
        - label: Step-by-Step - one task per continue
          value: step_by_step
        - label: Manual - no automatic task execution
          value: manual

  - name: execution_context
    title: Function Execution Context
    type: string
    default: user
    description: |
      Who functions execute as when called by this agent:
      - "user": Functions run with the chatting user's permissions (default, recommended)
      - "agent": Functions run under THIS AGENT's own roles and groups (below)
      - "system": Functions run with full system privileges (use with caution)
    ui:
      widget: select
      options:
        - label: User Context (Recommended)
          value: user
        - label: Agent's Own Permissions
          value: agent
        - label: System Context (Elevated)
          value: system

  # An agent is a PRINCIPAL, not only a prompt.
  #
  # Until these existed an agent could run as the chatting user or as the whole
  # system, and nothing in between — so "let the triage bot read tickets and
  # write nothing else" had no expression, and every unattended agent ran with
  # full privileges. Roles and groups are resolved exactly as a user's are
  # (group expansion, role inheritance, the same permission set), and they take
  # effect only when `execution_context` is "agent".
  - name: roles
    title: Roles
    type: array
    items:
      type: string
    description: Role ids this agent holds when running under its own permissions.

  - name: groups
    title: Groups
    type: array
    items:
      type: string
    description: Group ids this agent belongs to when running under its own permissions.

  - name: provider
    title: Provider
    type: string
    required: true
    # The SLUG of a provider configured on this tenant — not a provider kind.
    #
    # This was a fixed three-option select of kinds, which stopped being correct when
    # providers became slug-addressed: a tenant can configure several of the same kind,
    # and the slug is what tells them apart. A kind name still works wherever it is also
    # the slug (`openai`, `anthropic`), which is the back-compat default for entries that
    # predate slugs — so existing agents keep resolving — but it is a coincidence rather
    # than the rule, and there is no default here any more because the right value depends
    # entirely on what the tenant has configured.
    description: >-
      Slug of a provider configured on this tenant, e.g. `marvel` or `openai`.
      See Admin Console > AI Settings for the available slugs.
    ui:
      widget: text
      placeholder: marvel

  - name: model
    title: Model
    type: string
    required: true
    default: gpt-4
    description: The AI model to use

  - name: temperature
    title: Temperature
    type: number
    default: 0.7
    description: Creativity level (0-2). Higher = more creative
    validation:
      min: 0
      max: 2

  - name: max_tokens
    title: Max Tokens
    type: Number
    default: 4096
    description: Maximum response length in tokens
    validation:
      min: 1
      max: 100000

  - name: max_history_messages
    title: Max History Messages
    type: Number
    required: false
    description: |
      Maximum number of conversation history entries sent to the model per
      turn (overrides the built-in default of 50). The system prompt and
      compaction summary are always kept in addition to this window.
    validation:
      min: 1
      max: 1000

  - name: auto_compact
    title: Auto-Compact Conversations
    type: boolean
    default: false
    description: |
      When enabled, once a conversation exceeds compact_threshold_messages,
      older messages are summarized with one extra AI call and replaced in
      the model context by a persisted summary (raisin:AICompaction node).

  - name: compact_threshold_messages
    title: Compaction Threshold (messages)
    type: Number
    default: 30
    description: |
      Number of active (not yet compacted) conversation messages that
      triggers auto-compaction at the start of a turn. Only used when
      auto_compact is true.
    validation:
      min: 2
      max: 1000

  - name: compact_keep_messages
    title: Messages Kept After Compaction
    type: Number
    required: false
    description: |
      Minimum number of most recent messages preserved verbatim when
      compacting. Defaults to max(2, compact_threshold_messages / 3);
      at least a third of the active messages is always kept.
    validation:
      min: 1
      max: 1000

  - name: max_conversation_tokens
    title: Max Conversation Tokens
    type: Number
    required: false
    description: |
      Token budget between compactions. With auto_compact enabled, the agent
      compacts at 80% pressure and begins a fresh token window from the saved
      checkpoint. If compaction is disabled or cannot make progress, reaching
      the limit produces a budget-exceeded response without calling the AI.
    validation:
      min: 1

  - name: max_tool_rounds
    title: Max Tool Rounds
    type: Number
    required: false
    description: |
      How many TOOL ROUNDS one user message may take. A round is one trip:
      the agent calls tools, they run, and it is asked again.

      Defaults to 20, which is plenty for a conversation and not much for a
      job. An agent that builds something, validates it and fixes what it
      finds spends rounds on each, and a multi-step plan can exhaust the
      default before its last task starts — the turn then ends with
      "I've reached the maximum number of tool continuation steps", mid-work.
      Raise it for agents that do long jobs; 80 is a reasonable figure for a
      builder. Capped at 200, because this budget is also the only thing
      between a confused agent and an unbounded bill.
    validation:
      min: 1
      max: 200

allowed_children: []
