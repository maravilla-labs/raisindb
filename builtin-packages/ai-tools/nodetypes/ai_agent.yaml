name: raisin:AIAgent
title: AI Agent
description: AI agent definition with system prompt, tools, and rules
icon: bot
color: "#8B5CF6"

properties:
  - name: system_prompt
    title: System Prompt
    type: string
    required: true
    description: System message defining AI behavior
    ui:
      widget: textarea
      rows: 10

  - name: tools
    title: Tools
    type: array
    items:
      type: Reference
    description: References to raisin:Function nodes that the agent can use

  - name: rules
    title: Rules
    type: array
    items:
      type: string
    description: Additional behavioral rules for the agent

  - name: task_creation_enabled
    title: Task Creation Enabled
    type: boolean
    default: false
    description: Whether the agent can create and manage structured plans/tasks. When disabled, planning-category tools are filtered out even if listed in tools.

  - name: thinking_enabled
    title: Thinking Enabled
    type: boolean
    default: true
    description: Show reasoning steps to user

  - name: execution_mode
    title: Task Execution Mode
    type: string
    default: automatic
    description: |
      Plan/task execution policy:
      - automatic: create and execute tasks immediately
      - approve_then_auto: require plan approval, then execute all tasks automatically
      - step_by_step: execute one task per continue signal
      - manual: no automatic task execution
    ui:
      widget: select
      options:
        - label: Automatic - execute tasks immediately
          value: automatic
        - label: Approve Then Auto - approve plan, then run all tasks
          value: approve_then_auto
        - label: Step-by-Step - one task per continue
          value: step_by_step
        - label: Manual - no automatic task execution
          value: manual

  - name: execution_context
    title: Function Execution Context
    type: string
    default: user
    description: |
      Who functions execute as when called by this agent:
      - "user": Functions run with the chatting user's permissions (default, recommended)
      - "system": Functions run with full system privileges (use with caution)
    ui:
      widget: select
      options:
        - label: User Context (Recommended)
          value: user
        - label: System Context (Elevated)
          value: system

  - name: provider
    title: Provider
    type: string
    required: true
    # The SLUG of a provider configured on this tenant — not a provider kind.
    #
    # This was a fixed three-option select of kinds, which stopped being correct when
    # providers became slug-addressed: a tenant can configure several of the same kind,
    # and the slug is what tells them apart. A kind name still works wherever it is also
    # the slug (`openai`, `anthropic`), which is the back-compat default for entries that
    # predate slugs — so existing agents keep resolving — but it is a coincidence rather
    # than the rule, and there is no default here any more because the right value depends
    # entirely on what the tenant has configured.
    description: >-
      Slug of a provider configured on this tenant, e.g. `marvel` or `openai`.
      See Admin Console > AI Settings for the available slugs.
    ui:
      widget: text
      placeholder: marvel

  - name: model
    title: Model
    type: string
    required: true
    default: gpt-4
    description: The AI model to use

  - name: temperature
    title: Temperature
    type: number
    default: 0.7
    description: Creativity level (0-2). Higher = more creative
    validation:
      min: 0
      max: 2

  - name: max_tokens
    title: Max Tokens
    type: Number
    default: 4096
    description: Maximum response length in tokens
    validation:
      min: 1
      max: 100000

  - name: max_history_messages
    title: Max History Messages
    type: Number
    required: false
    description: |
      Maximum number of conversation history entries sent to the model per
      turn (overrides the built-in default of 50). The system prompt and
      compaction summary are always kept in addition to this window.
    validation:
      min: 1
      max: 1000

  - name: auto_compact
    title: Auto-Compact Conversations
    type: boolean
    default: false
    description: |
      When enabled, once a conversation exceeds compact_threshold_messages,
      older messages are summarized with one extra AI call and replaced in
      the model context by a persisted summary (raisin:AICompaction node).

  - name: compact_threshold_messages
    title: Compaction Threshold (messages)
    type: Number
    default: 30
    description: |
      Number of active (not yet compacted) conversation messages that
      triggers auto-compaction at the start of a turn. Only used when
      auto_compact is true.
    validation:
      min: 2
      max: 1000

  - name: compact_keep_messages
    title: Messages Kept After Compaction
    type: Number
    required: false
    description: |
      Minimum number of most recent messages preserved verbatim when
      compacting. Defaults to max(2, compact_threshold_messages / 3);
      at least a third of the active messages is always kept.
    validation:
      min: 1
      max: 1000

  - name: max_conversation_tokens
    title: Max Conversation Tokens
    type: Number
    required: false
    description: |
      Token budget per conversation. The running total (total_tokens_used on
      the agent-side conversation node, accumulated from all cost records
      including compaction calls) is checked at turn start; when reached, the
      agent replies with a budget-exceeded message (finish_reason
      budget_exceeded) without calling the AI.
    validation:
      min: 1

allowed_children: []
