name: raisin:AITask
title: AI Task
description: Task created by AI during conversation
icon: check-square
color: "#34D399"

properties:
  - name: title
    title: Title
    type: string
    required: true
    description: Task title

  - name: description
    title: Description
    type: string
    description: Detailed task description
    ui:
      widget: textarea
      rows: 4

  - name: status
    title: Status
    type: string
    default: pending
    description: Current task status
    ui:
      widget: select
      options:
        - label: Pending
          value: pending
        - label: In Progress
          value: in_progress
        - label: Completed
          value: completed
        - label: Cancelled
          value: cancelled

  - name: priority
    title: Priority
    type: string
    default: normal
    description: Task priority level
    ui:
      widget: select
      options:
        - label: Low
          value: low
        - label: Normal
          value: normal
        - label: High
          value: high
        - label: Urgent
          value: urgent

  - name: delegation_id
    title: Delegation ID
    type: string
    readonly: true

  - name: delegation_status
    title: Delegation Status
    type: string
    readonly: true

  - name: delegated_agent_ref
    title: Delegated Agent
    type: Reference
    readonly: true

  - name: delegation_flow_instance_id
    title: Delegated Flow Instance
    type: string
    readonly: true

  - name: delegation_objective
    title: Delegation Objective
    type: string
    readonly: true

  - name: delegated_at
    title: Delegated At
    type: Date
    readonly: true

  - name: delegated_completed_at
    title: Delegation Completed At
    type: Date
    readonly: true

  - name: delegation_branch
    title: Review Branch
    type: string
    readonly: true

  - name: delegation_base_branch
    title: Base Branch
    type: string
    readonly: true

  - name: delegation_result
    title: Delegation Result
    type: Object
    readonly: true

  - name: delegation_error
    title: Delegation Error
    type: string
    readonly: true

  - name: delegation_review_action
    title: Delegation Review Action
    type: string
    readonly: true

  - name: delegation_reviewed_at
    title: Delegation Reviewed At
    type: Date
    readonly: true

allowed_children: []
