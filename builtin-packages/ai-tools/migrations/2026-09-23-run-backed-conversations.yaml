# Every agent conversation runs as an AgentRun, and delegation is a core child
# run. A package update never removes content it no longer ships, so this
# retires what an existing installation still holds of the legacy loop and of
# the one-shot delegation: the triggers and the flow are deleted (leaf nodes),
# the functions are disabled (their source files stay readable for history).
id: ai-tools-2026-09-23-run-backed-conversations
title: Retire the legacy chat loop and the one-shot delegation
operations:
  - !delete_node { workspace: functions, path: /triggers/raisin/ai/on-tool-result }
  - !delete_node { workspace: functions, path: /triggers/raisin/ai/on-user-message }
  - !delete_node { workspace: functions, path: /triggers/raisin/ai/delegation-mailbox-sweep }
  - !delete_node { workspace: functions, path: /flows/delegated-agent-task }
  - !patch_nodes { workspace: functions, path: /lib/raisin/ai/agent-continue-handler, properties: { enabled: false } }
  - !patch_nodes { workspace: functions, path: /lib/raisin/ai/complete-delegation, properties: { enabled: false } }
  - !patch_nodes { workspace: functions, path: /lib/raisin/ai/resolve-delegation-review, properties: { enabled: false } }
  - !patch_nodes { workspace: functions, path: /lib/raisin/ai/delegation-mailbox, properties: { enabled: false } }
