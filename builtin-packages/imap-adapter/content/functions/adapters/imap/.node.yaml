node_type: raisin:Function
properties:
  title: IMAP Adapter
  description: >
    Virtual-node adapter for IMAP mailboxes, implemented over the native
    raisin.imap binding (real RFC 3501 IMAP over implicit TLS). Translates the
    normalized adapter operations (capabilities, list, get, get_content,
    get_changes) into raisin.imap.{listMailboxes,fetchMessage,fetchSince}
    calls. No mirror surface: create/update/delete are unsupported. Invoked
    directly by the sync engine with a decrypted credential; owns no
    token-refresh logic.
    SEND: an outbox mount (write_config.mode: submit) turns one queued
    raisin:OutboundMail into one raisin.email.send through the tenant's
    configured SMTP/relay provider — IMAP itself has no submission verb. The
    adapter declares can_submit only when a provider is actually resolvable.
    EXPERIMENTAL Gmail push: when a mount sets sync_config.pubsub_topic the
    adapter also serves subscribe/renew/unsubscribe via the Gmail users.watch /
    users.stop REST API (Pub/Sub), reusing the XOAUTH2 OAuth token as bearer.
  language: javascript
  entry_file: index.js:handler
  execution_mode: Async
  enabled: true
  # 2: documents, at opList, that a forced FULL reconcile prunes every message
  #    node on this mount, because `list` enumerates mailboxes only.
  # 3: sync_config.folder_scope: "tree" — mailbox subtrees. The mount's mailbox
  #    and everything under it, with the folder hierarchy materialised, a
  #    per-mailbox cursor map inside the one opaque sync token, and a rotation
  #    index so no mailbox starves. Mailbox identity and mailbox->path move to
  #    mailboxes.js, which the walk and the delta BOTH call, because a path they
  #    disagree about relocates every node under it on every run. Tree mode
  #    changes the message id space (<mailbox>|<uidvalidity>.<uid>, the same
  #    string the path leaf uses so a UIDVALIDITY reset moves BOTH), so a mount
  #    switched to it re-imports once. get_changes also RE-ASSERTS the folder
  #    set once per rotation round: the mount is ephemeral, the engine's TTL
  #    sweep exempts nothing, and the walk that built the hierarchy runs only
  #    once — so without that the folders were deleted a day after the backfill
  #    and came back un-owned. Default is unchanged: absent or anything but the
  #    literal "tree" is exactly today's single-mailbox behaviour.
  version: 3
  resource_limits:
    timeout_ms: 180000
    max_memory_bytes: 67108864
  # network_policy authorizes the native IMAP egress. The binding builds a
  # synthetic `imaps://<host>:<port>` URL from the connection and refuses to open
  # a socket unless it matches an allowed_urls pattern. `http_enabled: true` is
  # REQUIRED — it is the master switch for ALL native egress (HTTP *and* IMAP),
  # not just raisin.http.fetch. Add your mail host as `imaps://<host>:993`.
  network_policy:
    http_enabled: true
    request_timeout_ms: 180000
    max_concurrent_requests: 10
    allowed_urls:
      - "imaps://imap.gmail.com:993"
      - "imaps://imap.fastmail.com:993"
      - "imaps://outlook.office365.com:993"
      - "imaps://imap.mail.me.com:993"
      # Add your provider's IMAP host explicitly, e.g.:
      # - "imaps://imap.example.org:993"
      # Gmail push (Pub/Sub watch): the subscribe/renew/unsubscribe ops call the
      # Gmail REST API over HTTPS with the same OAuth token used for XOAUTH2 IMAP.
      # `**` is required — `*` does not cross `/`. Only reached when a mount sets
      # sync_config.pubsub_topic; plain IMAP mounts never call it.
      - "https://gmail.googleapis.com/**"
  # THE SEND PATH. `submit` calls raisin.email.send, which is deny-by-default
  # per function: with no email_policy the adapter cannot send at all, and it
  # reports can_submit:false with that as the reason rather than resolving as a
  # writable mount that throws at drain time.
  #
  # Shipped OFF, exactly like the allowed_urls list above is shipped with only
  # the well-known hosts: turning it on is a decision about this tenant's
  # sending reputation, and an outbox is not usable without an operator who has
  # made it. To enable an outbox:
  #
  #   1. enabled: true
  #   2. list the recipient DOMAINS this mailbox may write to — globs, e.g.
  #      "example.com", "*.example.com". `"*"` means any domain and is what a
  #      general-purpose outbox needs; write it deliberately, it is the whole
  #      allowlist.
  #
  # `enabled: true` with an empty allowed_recipients still denies everything:
  # "opted in" never silently means "unrestricted".
  email_policy:
    enabled: false
    allowed_recipients: []
  # Resolving the selected sender's credential_ref runs the SECRET policy too,
  # so a function may hold email_policy and still be refused the key. `email/*`
  # covers the conventional refs (secret://email/api_key,
  # secret://email/smtp_password); narrow it if yours live elsewhere. Inert
  # while email_policy is off — nothing on the read path touches a secret.
  secret_policy:
    enabled: true
    allowed_names:
      - "email/*"
  input_schema:
    type: object
    required:
      - operation
    properties:
      operation:
        type: string
        description: >
          One of capabilities, list, get, get_content, get_changes, submit
          (an outbox mount's send), and — for a Gmail mount that configures
          sync_config.pubsub_topic — subscribe, renew, unsubscribe (Pub/Sub
          watch lifecycle).
      params:
        type: object
        description: Operation-specific arguments
      credential:
        type: object
        description: >
          Decrypted account credential { username, password | app_password |
          access_token, account_id, provider_type }. The secret is an app
          password or an XOAUTH2 access token; it is never logged.
      mount:
        type: object
        description: >
          Read-only mount snapshot { mount_id, remote_root, mount_path,
          sync_config, api_config, config }. The merged config carries host,
          port, tls, mailbox, and — for an outbox — email_provider, the name of
          the tenant sender this mount posts through.
  output_schema:
    type: object
    description: Operation-specific result (ExternalItem, page, Capabilities, Change feed, ...)
