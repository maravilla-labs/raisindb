node_type: raisin:Integration
properties:
  title: Gmail (Experimental)
  # EXPERIMENTAL / PREVIEW connector. Speaks Gmail over REAL IMAP (RFC 3501) with
  # implicit TLS via the native raisin.imap binding, authenticated with an XOAUTH2
  # access token minted from the Google OAuth flow. Validate against your own
  # account before relying on it in production.
  provider_type: gmail
  docs_url: https://developers.google.com/gmail/api/guides/push
  setup_instructions: |
    ## Connect Gmail (Experimental)

    1. In the [Google Cloud console](https://console.cloud.google.com/), pick a
       project and enable the **Gmail API** (APIs & Services → Library).
    2. Create an **OAuth client ID** (**Web application**) and, under Authorized
       redirect URIs, add the **Redirect URI shown above** in this editor.
    3. Paste the **Client ID** and **Client secret** here (secret encrypted at
       rest). Scope `https://mail.google.com/` is required.
    4. Click **Connect account**, then create a mount to sync a mailbox.

    ### Push via Pub/Sub (optional)
    Gmail has no webhook, so real-time push rides Google Cloud Pub/Sub, and
    **you must paste the mount's Notification URL into Pub/Sub yourself**:

    1. Create a Pub/Sub **topic**; grant `gmail-api-push@system.gserviceaccount.com`
       the **Pub/Sub Publisher** role on it.
    2. Create a **push subscription** whose endpoint is the **Notification URL
       shown on the mount** in this console.
    3. On the mount's `sync_config`, set `pubsub_topic`, a `pubsub_verify_token`,
       and `mode: hybrid`. Absent a topic, the mount stays poll-only.
  # THE DELETE GUARD, MADE REAL.
  #
  # `sync_config.reconcile_deletes` (engine default TRUE) exists because of this
  # adapter: `list` enumerates MAILBOXES, never messages, so a forced FULL run
  # produces a `seen` set holding mailbox ids only. It is non-empty, so the
  # engine's empty-reconcile guard does not fire, and reconcile then prunes EVERY
  # message node on the mount. They do not come back — the delta baseline that
  # follows the walk discards its items and resumes at the highest UID already
  # seen. Until this bundle existed the flag was inert: it protected only an
  # operator who had read the README and hand-edited a mount. Now "Add bundle"
  # ships it off, so the default is safe rather than documented.
  #
  # `'off'` is QUOTED: serde_yaml is YAML 1.1, where a bare `off` is boolean
  # false, and both `writeback` and `mode` are Strings.
  mount_bundles:
    - id: gmail-mailbox
      title: Gmail mailbox
      description: >-
        An inbox that agents work, and an outbox that sends. In tree mode
        [Gmail]/All Mail, Trash and Spam are skipped by their SPECIAL-USE
        attributes — All Mail re-lists every message in the account and would
        otherwise import the whole mailbox a second time under a second path. The inbox is
        EPHEMERAL by design — messages expire after a day and are re-fetched, so
        the mount is a live queue rather than an archive; IMAP has no CONDSTORE
        or EXPUNGE feed here, so nothing else can retire a message that is gone
        from the server. The outbox does not send over IMAP (the protocol has no
        submission verb) but through the tenant's configured email provider.
      default_workspace: workplace
      default_root: /gmail
      prompts:
        - key: mailbox
          title: Mailbox
          # `text`, not `remote`: this adapter declares no `browse` operation, so
          # there is nothing for a picker to call.
          type: text
          help: >-
            The IMAP folder to sync, e.g. INBOX or INBOX/Projects. Leave empty
            for the connection's default.
          applies_to: [inbox]
          target: sync_config.mailbox
        - key: folder_scope
          title: Folder scope
          type: select
          options: [folder, tree]
          help: >-
            folder = this mailbox only. tree = it and every mailbox beneath it —
            and the cost is one IMAP login PER MAILBOX per poll, because every
            binding call opens its own TCP+TLS+LOGIN (Gmail allows 15 concurrent
            connections per account). Tree mode also uses a different message id
            space, so switching a live mount to it re-imports the mailbox once.
          applies_to: [inbox]
          target: sync_config.folder_scope
        - key: email_provider
          title: Sending provider
          type: text
          help: >-
            Name of the configured tenant email sender the outbox posts through.
            Leave empty for the tenant default. The mount reports can_submit
            false until one resolves.
          applies_to: [outbox]
          target: sync_config.email_provider
      mounts:
        - key: inbox
          title: Inbox
          subpath: inbox
          default: true
          remote_root: INBOX
          node_types: [raisin:Mail, raisin:Folder, raisin:Asset]
          mapping_function: /mappers/imap-default
          sync_config:
            mode: poll
            # 300s is the floor for this deployment, not a tuning knob. Tighter
            # polling gets the account rate-limited.
            interval_seconds: 300
            ephemeral: true
            ttl_seconds: 86400
            # THE POINT OF THIS BUNDLE. See the comment above: with this true, a
            # single forced full resync deletes every message node on the mount.
            reconcile_deletes: false
          # Read-only. Writing FLAGS back (UID STORE) is what would make this a
          # state_only mount, and that needs a Rust binding this adapter has not
          # got — so the mode is not offered rather than declared and refused at
          # drain time.
          write_config: { writeback: 'off', mode: 'off' }
        - key: outbox
          title: Outbox
          subpath: outbox
          # Materialises nothing: the outbox mapper's `to_node` returns null.
          # The node type is what a COMPOSER creates here, listed so the console
          # checks it against the target workspace's allowed_node_types —
          # otherwise the first queued mail is rejected on insert.
          node_types: [raisin:OutboundMail]
          mapping_function: /mappers/imap-outbox
          # Daily, and that is not a latency setting: a queued command drains
          # immediately through the engine's capture path, so the interval only
          # governs the read walk this mount does not want.
          sync_config:
            mode: poll
            interval_seconds: 86400
            # Same reason as the inbox. The stale filter exempts command nodes,
            # so this is belt and braces — but a mount whose walk cannot
            # enumerate its own content should say so, not rely on an exemption
            # that is about something else.
            reconcile_deletes: false
          # `submit`, not `mirror`: sending is a command, not a mirrored object.
          # Creating the node does nothing — setting `status: queued` sends it.
          write_config:
            writeback: 'off'
            mode: submit
            command_node_types: [raisin:OutboundMail]
  # Shares the generic IMAP adapter — Gmail is reached as a standard IMAP server.
  adapter_function: /adapters/imap
  # Disabled until an operator completes the OAuth flow and connects a Google
  # account via the admin console. No secret is ever stored on this node in
  # cleartext, and no client_secret is shipped.
  enabled: false
  # Connection defaults for the adapter. The adapter reads api_config as template
  # defaults and lets a mount's sync_config override any of host/port/tls/mailbox/
  # auth per mount. `auth: xoauth2` selects the SASL XOAUTH2 handshake, using the
  # connected account's OAuth access token as the IMAP login secret.
  api_config:
    protocol: imap
    host: imap.gmail.com
    port: 993
    tls: true
    default_mailbox: INBOX
    auth: xoauth2
  # PUSH (Experimental / Preview) — Gmail has no direct webhook, so push rides
  # Google Cloud Pub/Sub. Set these on the MOUNT's sync_config (not here), because
  # the topic is per-deployment. When sync_config.pubsub_topic is present the
  # adapter reports supports_push:true and the engine arms `users.watch`; absent,
  # the mount stays poll-only. See the imap-adapter README "Gmail push via Pub/Sub"
  # for the one-time operator setup (create topic, grant gmail-api-push publisher,
  # create a push subscription pointing at the mount's notifications endpoint).
  #   sync_config:
  #     mode: hybrid            # push + poll as a safety net (recommended)
  #     interval_seconds: 300   # slow poll backstop while push is live
  #     pubsub_topic: projects/<your-project>/topics/<your-topic>
  #     pubsub_verify_token: <optional shared secret echoed as the subscription secret>
  # A Pub/Sub ping is a pure INVALIDATION signal: its historyId is ignored and the
  # engine simply re-runs the normal IMAP UID delta to fetch new mail.
  # Google OAuth endpoints for minting the XOAUTH2 access token. The client secret
  # is stored ONLY as client_secret_encrypted (AES-256-GCM) after an operator
  # supplies it in the console — never here. access_type=offline + prompt=consent
  # ensure a refresh token is issued so the engine can keep the access token fresh.
  oauth_config:
    auth_url: https://accounts.google.com/o/oauth2/v2/auth
    token_url: https://oauth2.googleapis.com/token
    scopes:
      - https://mail.google.com/
    redirect_uri: ""
    access_type: offline
    prompt: consent
  # No connected_accounts, client_id, or client_secret_encrypted are shipped.
