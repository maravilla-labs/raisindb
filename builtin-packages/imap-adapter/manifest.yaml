name: imap-adapter
version: 1.4.0
title: IMAP Mailbox Adapter
description: >
  Virtual-node adapter for IMAP mailboxes. Mount an inbox into a workspace path
  and RaisinDB streams new messages in as ephemeral nodes that agents work and
  that auto-expire. An optional outbox mount SENDS — not over IMAP, which has no
  submission verb, but through the tenant's configured email provider. Speaks REAL IMAP (RFC 3501) over TLS via the native
  raisin.imap binding — no JMAP proxy required. Ships the adapter function, a
  default message mapper, and a pre-configured (disabled) raisin:Integration
  template you complete with your own mailbox credentials in the admin console.
author: RaisinDB Team
license: BSL-1.1
icon: mail
color: "#d93025"
keywords:
  - imap
  - tls
  - email
  - inbox
  - integration
  - virtual-nodes
  - sync
  - adapter
  - ephemeral
# Discovery contract for the admin console's Integrations gallery.
category: integrations

# Built-in package flag - embedded and available for manual install.
builtin: true
# Opt out of boot-time auto-install into every repo; install manually
# from the Integrations gallery once the target repo can accept it.
auto_install: false

provides:
  # Config schema rendered by the admin console's "Add connection" form.
  nodetypes:
    - imap:ConnectionConfig
  functions:
    - /functions/adapters/imap
    - /functions/mappers/imap-default
    # The OUTBOX (write_config.mode: submit) mapper: raisin:OutboundMail -> the
    # message the adapter's `submit` hands to raisin.email.send. IMAP cannot
    # send, so the send leaves through the tenant's configured SMTP/relay
    # provider rather than over the mount's own connection.
    - /functions/mappers/imap-outbox
  # Pre-configured integration template (disabled until credentials are supplied).
  content:
    - raisin:system/connectors/imap
    # Experimental Gmail connector template (XOAUTH2 over IMAP), disabled.
    - raisin:system/connectors/gmail

# Sync configuration for package updates
# Defines which paths this package owns to prevent conflicts with other packages
sync:
  defaults:
    mode: merge
    on_conflict: prefer_server

  filters:
    # Adapter + mapper functions
    - root: /adapters/imap
      include:
        - "**"
      mode: merge
    - root: /mappers/imap-default
      include:
        - "**"
      mode: merge
    - root: /mappers/imap-outbox
      include:
        - "**"
      mode: merge

    # Integration templates in the system workspace
    # skip, NOT merge. This node is the operator's LIVE connector config: it holds
    # client_id, the encrypted client secret, connected_accounts and the tenant
    # authority. `merge` re-applied the shipped template over it and reset every
    # one of those to the packaged defaults — observed in production as a
    # configured Microsoft connector reverting to client_id: "", no secret, zero
    # accounts and auth_url back to `common`, which silently killed every mount
    # that depended on it. `skip` is documented for exactly this ("preserve
    # tenant-owned content across updates"): the template lands once, on first
    # install, and is never written again.
    #
    # Deliberately scoped to the integration node only. The adapter and mapper
    # functions above stay `merge` — those are OUR code and MUST keep updating,
    # which is what gets a connector fix to a running deployment.
    # NOTE: no filter for the connector template below.
    #
    # There used to be a `mode: skip` entry here protecting the operator's live
    # connector node, because a re-install replaced its whole property map and
    # wiped the client id, the encrypted secret and every connected account. It
    # never worked: nothing on the install path reads `manifest.sync` (only the
    # exporter does), install reads only a `.raisin-sync.yaml` at the zip root
    # which this package does not ship, `SyncFilter` has no `workspace` field so
    # that key was dropped by serde, and the root would not have matched anyway.
    #
    # The template now lives under `/connectors`, which packages own and may
    # overwrite freely, while operator instances live under `/integrations`,
    # which NO package declares. The protection is structural: install cannot
    # reach a path no package ships. Do not add a policy filter back.

# Workspace configuration for auto-created folders
workspace_patches:
  functions:
    default_folder_type: raisin:Folder
  "raisin:system":
    default_folder_type: raisin:Folder
    allowed_node_types:
      add:
        - raisin:Integration
        - raisin:VirtualMount
