node_type: raisin:Function
properties:
  title: Google Drive Adapter
  description: >
    Virtual-node adapter for Google Drive (Drive v3). Translates the normalized
    adapter operations (capabilities, list, get, get_content, create, update,
    delete, get_changes, finalize_upload) into Google Drive REST calls. Invoked
    directly by the sync engine with a decrypted access token; owns no
    token-refresh logic.
    WRITES are the full mirror set plus BYTES: `accepts_content` makes the engine
    send a node's file, and every content write is answered with a RESUMABLE
    UPLOAD SESSION that the engine streams to before calling back with
    `finalize_upload`. A write needs a ReadWrite scope
    (https://www.googleapis.com/auth/drive, or drive.file for app-created files
    only) which a read-only connector does not request — add it and re-consent
    per account, since Google only issues a widened scope on fresh consent.
  language: javascript
  entry_file: index.js:handler
  execution_mode: Async
  enabled: true
  # 2: the write path against the parameters the engine actually sends
  #    (payload / parent_external_id / relative_path / content-as-an-object),
  #    the resumable upload channel, and delta items that carry their FOLDER
  #    PATH — a webhook- or poll-delivered file now lands where the full walk
  #    would have put it instead of flat at the mount root.
  # 3: an unusable `changes` pageToken (400 invalidPageToken / 400 invalid /
  #    404) is now thrown as `cursor_invalid` instead of a plain Error. As a
  #    plain Error the engine classified it Transient and re-sent the SAME dead
  #    cursor on every drain forever — the mount imported nothing and never
  #    reconciled.
  version: 3
  resource_limits:
    timeout_ms: 120000
    max_memory_bytes: 67108864
  # Outbound access is restricted to Google's Drive/API and OAuth token hosts.
  # `/upload/drive/v3/...` lives on the same host and is already covered.
  #
  # THE UPLOAD PATH ADDS NOTHING HERE, and that is the design rather than an
  # omission: this adapter only NEGOTIATES the resumable session (an ordinary
  # JSON call to www.googleapis.com). The session URL it hands back is streamed
  # by the ENGINE in Rust, under the operator's egress policy, exactly as it
  # downloads a read's fetch_url. Listing it here would mean the adapter was
  # pushing megabytes through a QuickJS string, which is what the two-call shape
  # exists to avoid.
  network_policy:
    http_enabled: true
    request_timeout_ms: 120000
    max_concurrent_requests: 10
    allowed_urls:
      - "https://www.googleapis.com/**"
      - "https://oauth2.googleapis.com/**"
  input_schema:
    type: object
    required:
      - operation
    properties:
      operation:
        type: string
        description: >
          One of capabilities, list, get, get_content, create, update, delete,
          get_changes, finalize_upload (called after the engine streamed a
          resumable upload session)
      params:
        type: object
        description: Operation-specific arguments
      credential:
        type: object
        description: Decrypted account credential { access_token, account_id, provider_type }
      mount:
        type: object
        description: Read-only mount snapshot { mount_id, remote_root, mount_path, sync_config }
  output_schema:
    type: object
    description: Operation-specific result (ExternalItem, page, Capabilities, Change feed, ...)
