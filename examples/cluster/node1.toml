# RaisinDB Node 1 Configuration
# Example 3-node cluster setup

[server]
port = 8081
bind_address = "127.0.0.1"
data_dir = "./data/node1"
initial_admin_password = "Admin1234567!8"  # Change in production!
# Enable anonymous access for unauthenticated HTTP/WebSocket requests
# Anonymous users get permissions from the "anonymous" role in access_control
anonymous_enabled = true
# CORS allowed origins for cross-origin requests (e.g., frontend dev servers)
cors_allowed_origins = ["http://localhost:5173"]

[replication]
enabled = true
node_id = "node1"
port = 9001
bind_address = "127.0.0.1"

# Peer nodes in the cluster
[[replication.peers]]
peer_id = "node2"
address = "127.0.0.1"
port = 9002

[[replication.peers]]
peer_id = "node3"
address = "127.0.0.1"
port = 9003

# Atomic locks / inventory subsystem (acquire / tie-breaker primitive).
# Exposed to server-side functions (raisin.locks.* / raisin.inventory.*),
# the WS node API, and HTTP (/api/{repo}/{branch}/locks|inventory/*).
[locks]
enabled = true
# "inprocess" = single-node only (DashMap). For a multi-node cluster like this
# one you MUST use "redis", or claims/locks will not coordinate across nodes
# and will oversell. The server logs a warning if inprocess + replication.
# NOTE: backend="redis" requires building the server with --features locks-redis.
backend = "redis"
reaper_interval_secs = 30

[locks.redis]
url = "redis://127.0.0.1:6379/0"
# Key prefix; isolates multiple RaisinDB clusters sharing one Redis.
namespace = "raisin:locks"

# Outbound MCP client — where RaisinDB may connect when calling ANOTHER
# server's tools (RaisinDB as an MCP client). Distinct from the inbound MCP
# server surface, which is content: a raisin:McpServer node in the `mcp`
# workspace, not config.
#
# The whole section is optional. Omitting it keeps the safe defaults below,
# which refuse loopback and private addresses — an operator-supplied connection
# URL must not be able to turn the server into a proxy into its own network
# (http://169.254.169.254/ is cloud instance metadata).
[mcp_client]
# Empty = any PUBLIC host. Listing hosts narrows further, to named third
# parties. Entries are exact ("mcp.linear.app") or a wildcard suffix
# ("*.example.com", which matches sub-domains but NOT the bare apex).
allowed_hosts = []
# Permit loopback/private addresses AND plain http. Turn on only for local
# development, or when an MCP server runs as a sidecar on a known address.
allow_private_addresses = false
# Cap on a single response body from a remote server.
max_response_bytes = 8388608
# Per-request timeout; a connection may lower it via refresh_policy.call_timeout_ms.
default_timeout_ms = 30000

# Operator-named platform hooks, reachable from functions as
# `raisin.platform.hook("<name>", payload)`. The function names the hook; the
# URL and token live only here, and the runtime stamps tenant_id / repo_id into
# the payload. This is the supported way for content code to reach a platform
# service on a loopback or private address -- `raisin.http.fetch` refuses those
# and must keep refusing them.
#
# [platform.hooks.studio_update]
# url = "http://127.0.0.1:8080/internal/studio/update"
# token_env = "STUDIO_INTERNAL_TOKEN"
# token_header = "x-studio-internal-token"
# timeout_ms = 120000

# WebAssembly component functions (`language: wasm`). Every value below is the
# shipped default, so the whole section may be omitted. It is installed
# process-wide once at boot: the engine is built from these numbers on the
# first execution and cannot be reconfigured afterwards.
#
# [functions.wasm]
# # false still registers the runtime, so a wasm function fails naming this
# # setting rather than reporting an unknown language.
# enabled = true
# # Largest artifact accepted at load, run-file and upload (32 MiB).
# # jco/StarlingMonkey components are 8-15 MB, so do not lower this blindly.
# max_artifact_bytes = 33554432
# # Process-wide compiled-code budget, evicted LRU by weight (256 MiB).
# compiled_cache_bytes = 268435456
# # Engine-global guest stack ceiling. A function's resource_limits cannot
# # raise it: wasmtime fixes the stack size when the engine is built.
# max_wasm_stack_bytes = 1048576
# # Epoch ticker period; timeout resolution is one tick.
# epoch_tick_ms = 10
# # "on-demand" (nothing reserved up front) or "pooling" (a pool reserved at
# # engine construction -- faster to instantiate, and a too-large reservation
# # fails at BOOT).
# allocation = "on-demand"
# # Pooling sizing only: concurrent component instances the pool reserves.
# max_instances = 15
# # Per stream, per execution capture ceiling for guest stdout/stderr.
# stdout_capture_bytes = 1048576
