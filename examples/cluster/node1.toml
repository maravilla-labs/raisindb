# RaisinDB Node 1 Configuration
# Example 3-node cluster setup

[server]
port = 8081
bind_address = "127.0.0.1"
data_dir = "./data/node1"
initial_admin_password = "Admin1234567!8"  # Change in production!
# Enable anonymous access for unauthenticated HTTP/WebSocket requests
# Anonymous users get permissions from the "anonymous" role in access_control
anonymous_enabled = true
# CORS allowed origins for cross-origin requests (e.g., frontend dev servers)
cors_allowed_origins = ["http://localhost:5173"]

[replication]
enabled = true
node_id = "node1"
port = 9001
bind_address = "127.0.0.1"

# Peer nodes in the cluster
[[replication.peers]]
peer_id = "node2"
address = "127.0.0.1"
port = 9002

[[replication.peers]]
peer_id = "node3"
address = "127.0.0.1"
port = 9003

# Atomic locks / inventory subsystem (acquire / tie-breaker primitive).
# Exposed to server-side functions (raisin.locks.* / raisin.inventory.*),
# the WS node API, and HTTP (/api/{repo}/{branch}/locks|inventory/*).
[locks]
enabled = true
# "inprocess" = single-node only (DashMap). For a multi-node cluster like this
# one you MUST use "redis", or claims/locks will not coordinate across nodes
# and will oversell. The server logs a warning if inprocess + replication.
# NOTE: backend="redis" requires building the server with --features locks-redis.
backend = "redis"
reaper_interval_secs = 30

[locks.redis]
url = "redis://127.0.0.1:6379/0"
# Key prefix; isolates multiple RaisinDB clusters sharing one Redis.
namespace = "raisin:locks"
