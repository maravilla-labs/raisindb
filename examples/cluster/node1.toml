# RaisinDB Node 1 Configuration
# Example 3-node cluster setup

[server]
port = 8081
bind_address = "127.0.0.1"
data_dir = "./data/node1"
initial_admin_password = "Admin1234567!8"  # Change in production!
# Enable anonymous access for unauthenticated HTTP/WebSocket requests
# Anonymous users get permissions from the "anonymous" role in access_control
anonymous_enabled = true
# CORS allowed origins for cross-origin requests (e.g., frontend dev servers)
cors_allowed_origins = ["http://localhost:5173"]

[replication]
enabled = true
node_id = "node1"
port = 9001
bind_address = "127.0.0.1"

# Peer nodes in the cluster
[[replication.peers]]
peer_id = "node2"
address = "127.0.0.1"
port = 9002

[[replication.peers]]
peer_id = "node3"
address = "127.0.0.1"
port = 9003

# Atomic locks / inventory subsystem (acquire / tie-breaker primitive).
# Exposed to server-side functions (raisin.locks.* / raisin.inventory.*),
# the WS node API, and HTTP (/api/{repo}/{branch}/locks|inventory/*).
[locks]
enabled = true
# "inprocess" = single-node only (DashMap). For a multi-node cluster like this
# one you MUST use "redis", or claims/locks will not coordinate across nodes
# and will oversell. The server logs a warning if inprocess + replication.
# NOTE: backend="redis" requires building the server with --features locks-redis.
backend = "redis"
reaper_interval_secs = 30

[locks.redis]
url = "redis://127.0.0.1:6379/0"
# Key prefix; isolates multiple RaisinDB clusters sharing one Redis.
namespace = "raisin:locks"

# Outbound MCP client — where RaisinDB may connect when calling ANOTHER
# server's tools (RaisinDB as an MCP client). Distinct from the inbound MCP
# server surface, which is content: a raisin:McpServer node in the `mcp`
# workspace, not config.
#
# The whole section is optional. Omitting it keeps the safe defaults below,
# which refuse loopback and private addresses — an operator-supplied connection
# URL must not be able to turn the server into a proxy into its own network
# (http://169.254.169.254/ is cloud instance metadata).
[mcp_client]
# Empty = any PUBLIC host. Listing hosts narrows further, to named third
# parties. Entries are exact ("mcp.linear.app") or a wildcard suffix
# ("*.example.com", which matches sub-domains but NOT the bare apex).
allowed_hosts = []
# Permit loopback/private addresses AND plain http. Turn on only for local
# development, or when an MCP server runs as a sidecar on a known address.
allow_private_addresses = false
# Cap on a single response body from a remote server.
max_response_bytes = 8388608
# Per-request timeout; a connection may lower it via refresh_policy.call_timeout_ms.
default_timeout_ms = 30000
