# The Rust guest SDK for RaisinDB WebAssembly functions.
#
# Its OWN workspace on purpose (the repo root `[workspace] exclude`s `sdks/*`):
# this crate and everything built on it target `wasm32-wasip2` with their own
# profile, and pulled into the main workspace they would inherit its
# `.cargo/config.toml` `split-debuginfo=unpacked`, which does not exist on wasm32.
[workspace]
members = ["raisin-sdk-macros"]
resolver = "2"

[package]
name = "raisin-sdk"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Guest SDK for writing RaisinDB server functions as WebAssembly components"
license = "BSL-1.1"
publish = false

[dependencies]
raisin-sdk-macros = { version = "0.1.0", path = "raisin-sdk-macros" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Only guests need the WIT bindings; a native `cargo test` links neither
# wit-bindgen nor any wasm intrinsics and runs against `MockHost` instead.
[target.'cfg(target_family = "wasm")'.dependencies]
wit-bindgen = { version = "0.61", default-features = false, features = ["macros", "realloc", "std"] }

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
strip = true
codegen-units = 1
