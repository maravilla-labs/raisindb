[package]
name = "raisin-sdk-macros"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Procedural macros for raisin-sdk: #[handler] and export!"
license = "BSL-1.1"
publish = false

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
