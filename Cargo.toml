[workspace]
resolver = "2"
members = [
    "crates/*",
]
exclude = [
    "crates/.data",
    "crates/.claude",
    "examples/*",
    "tooling/*",
    # Guest-side crates: they build for wasm32-wasip2 with their own profiles
    # (opt-level="s", lto, panic="abort") and their own toolchains. Pulled into
    # this workspace they would inherit its profiles and its `.cargo/config.toml`
    # split-debuginfo setting, which does not exist on wasm32.
    "fixtures/*",
    "sdks/*"
]

[workspace.dependencies]
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0.68", features = ["preserve_order"] }
serde_with = {version = "3.11.0", features = ["macros"]}
nanoid = "0.4.0"
validator = { version = "0.20.0", features = ["derive"] }
schemars = {version = "0.9.0", features = ["chrono04", "rust_decimal1"]}
chrono = { version = "0.4", features = ["serde", "clock", "std"] }
# RFC 5545 recurrence expansion (calendar occurrence projection). Pulls
# chrono-tz, which is what makes "every Tuesday 09:00 Europe/Zurich" expand to
# the right UTC instant on both sides of a DST transition.
rrule = "0.14"
chrono-tz = "0.10"
cron = "0.15"
regex = "1.11.0"
lazy_static = "1.4.0"
reqwest = { version = "0.12", features = ["json", "multipart", "stream"] }
thiserror = "2.0.3"
anyhow = "1.0.75"
tempfile = "3.8"
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
rust-embed = "8.0"
mime_guess = "2.0"
base64 = "0.22"
hex = "0.4"
blake3 = "1.8"
rmp-serde = "1.3.0"
uuid = { version = "1.11", features = ["v4", "serde"] }
ts-rs = { version = "10.1", features = ["serde-compat"] }
futures = "0.3"
rust_decimal = { version = "1.36", features = ["serde-str", "maths"] }
url = "2.5"
matchit = "0.8"
zip = { version = "2.1", default-features = false, features = ["deflate"] }

# Geospatial
geo = "0.33.1"
geojson = { version = "1.0", features = ["geo-types"] }
geohash = "0.13.2"

# Disk/build tuning — keep target/ from ballooning across feature-set rebuilds.
#
# Measured breakdown of a full `cargo test --workspace` target/ (~44 GB):
#
#   deps/*.rlib + *.rmeta   ~4 GB   one per crate; irreducible for ~200 crates
#   deps/ test executables  ~2 GB   one per TEST TARGET, each statically linking
#                                   rocksdb + tantivy + candle + tesseract at
#                                   25-350 MB. Integration tests are consolidated
#                                   to one target per crate (tests/all/), which
#                                   took this from ~8 GB / 108 binaries down to
#                                   ~2 GB / 13. Don't add loose tests/*.rs files.
#   incremental/            ~5 GB+  per-crate recompilation caches
#   build/                  ~1 GB   compiled C deps (rocksdb, aws-lc, tesseract)
#
# Debug info is already suppressed below, and `.cargo/config.toml` externalizes
# what remains via `split-debuginfo=unpacked` (measured at only ~150 MB, so it is
# no longer a factor). The remaining lever is incremental caches — see
# `make disk` / `make prune` and the note in CLAUDE.md.
[profile.dev]
debug = "line-tables-only"   # enough for panic backtraces with line numbers

[profile.dev.package."*"]
debug = false                # dependencies: no debug info at all

# `cargo test` builds under the `test` profile. It inherits `dev`, but the
# package override has to be restated: dependency debug info would otherwise come
# back for every one of the 108 test binaries.
[profile.test]
debug = "line-tables-only"
# Incremental caches were measured at ~5 GB — the second-largest consumer after
# the test executables themselves — and buy little for test targets, which are
# usually compiled once per change rather than iterated on in place. Library
# iteration still gets incremental via `profile.dev`.
incremental = false

[profile.test.package."*"]
debug = false
