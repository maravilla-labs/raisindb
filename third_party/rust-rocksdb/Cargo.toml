# Vendored rocksdb 0.24.0 (rust-rocksdb) with one addition: `DB::resume()`,
# a binding for rocksdb::DB::Resume(), which the C API does not expose.
#
# Why: after a NoSpace write error RocksDB tries ONE automatic recovery right
# away; if the disk is still full that recovery fails, auto-recovery is turned
# off for good, and every later write returns the original IO error until the
# process restarts — even after space has been freed (local server,
# 2026-09-29). Resume() is the only in-process way out.
#
# The addition is src/resume.rs + resume_shim.cc + build.rs. Drop this vendor
# copy once upstream exposes Resume.
# THIS FILE IS AUTOMATICALLY GENERATED BY CARGO
