[package]
name = "raisin-mcp"
version = "0.1.0"
edition = "2021"
description = "Model Context Protocol (MCP) server surface for RaisinDB"
license = "BSL-1.1"

[lib]
path = "src/lib.rs"

[features]
default = ["client"]
# Re-exports the outbound client from raisin-mcp-protocol, so existing
# `raisin_mcp::client::…` paths keep resolving.
client = ["raisin-mcp-protocol/client"]

[dependencies]
# Workspace-pinned external crates
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
futures = { workspace = true }
base64 = { workspace = true }

# Internal RaisinDB crates (referenced by path)
raisin-error = { path = "../raisin-error" }
raisin-models = { path = "../raisin-models" }
raisin-functions = { path = "../raisin-functions" }
# Wire types + outbound client. Split out so crates BELOW raisin-functions
# (raisin-rocksdb and friends) can use MCP without closing a dependency cycle.
raisin-mcp-protocol = { path = "../raisin-mcp-protocol", default-features = false }

[dev-dependencies]
tokio = { workspace = true }
serde_json = { workspace = true }
