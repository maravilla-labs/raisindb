[package]
name = "raisin-mcp-protocol"
version = "0.1.0"
edition = "2021"
description = "Model Context Protocol wire types and outbound MCP client for RaisinDB"
license = "BSL-1.1"

[lib]
path = "src/lib.rs"

[features]
default = ["client"]
# Outbound MCP client: lets RaisinDB call OTHER servers' tools. Separable from
# the wire types, which the inbound server surface also needs.
client = ["dep:reqwest", "dep:url", "dep:async-trait", "dep:sha2"]

[dependencies]
# Workspace-pinned external crates
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
futures = { workspace = true }
base64 = { workspace = true }
reqwest = { workspace = true, optional = true }
url = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
# Schema hashing for the discovery churn guard.
sha2 = { version = "0.10", optional = true }

# Internal RaisinDB crates. Deliberately NOT raisin-functions: depending on it
# would recreate the very cycle this crate exists to break.
raisin-error = { path = "../raisin-error" }
raisin-models = { path = "../raisin-models" }

[dev-dependencies]
tokio = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true }
url = { workspace = true }
# Only to prove the [mcp_client] TOML section parses as the server will read it.
toml = "0.8"

# ONE integration-test target for the crate; see tests/all/main.rs.
[[test]]
name = "all"
path = "tests/all/main.rs"
