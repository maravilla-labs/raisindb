[package]
name = "raisin-functions"
version = "0.1.0"
edition = "2021"
description = "Serverless functions for RaisinDB - JavaScript and Starlark runtimes"
license = "BSL-1.1"

[lib]
path = "src/lib.rs"

# Regenerates the WebAssembly guest-SDK bindings from the bindings registry
# (`cargo run -p raisin-functions --bin gen-bindings`, or `make gen-bindings`).
# Declared explicitly so the target name is stable regardless of auto-discovery.
[[bin]]
name = "gen-bindings"
path = "src/bin/gen-bindings.rs"

[dependencies]
# Internal crates
raisin-error = { path = "../raisin-error" }
raisin-crypto = { path = "../raisin-crypto" }
raisin-models = { path = "../raisin-models" }
raisin-storage = { path = "../raisin-storage" }
raisin-events = { path = "../raisin-events" }
raisin-hlc = { path = "../raisin-hlc" }
raisin-locks = { path = "../raisin-locks" }
# Outbound MCP client, for executing proxy functions. Acyclic: the protocol
# crate deliberately does NOT depend on raisin-functions.
raisin-mcp-protocol = { path = "../raisin-mcp-protocol" }
# Parsing a request URL before the egress guard judges its addresses.
url = { workspace = true }
raisin-context = { path = "../raisin-context" }
raisin-ai = { path = "../raisin-ai", features = ["pdf", "pdf-markdown", "ocr"] }

# PDF processing (pure Rust)
pdf_oxide = "0.2"
raisin-flow-runtime = { path = "../raisin-flow-runtime" }
raisin-rocksdb = { path = "../raisin-rocksdb" }
raisin-binary = { path = "../raisin-binary" }
raisin-indexer = { path = "../raisin-indexer" }
raisin-hnsw = { path = "../raisin-hnsw" }
raisin-sql-execution = { path = "../raisin-sql-execution" }
raisin-core = { path = "../raisin-core" }

# Workspace dependencies
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
nanoid = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
futures = { workspace = true }
reqwest = { workspace = true }
uuid = { workspace = true }

# JavaScript runtime (QuickJS)
rquickjs = { version = "0.10", features = ["bindgen", "parallel", "futures", "macro", "loader"] }

# Starlark runtime (Python-like)
starlark = "0.13"
anyhow = "1.0"

# Utilities
glob = "0.3"
regex = "1"
base64 = "0.22"
mime_guess = { workspace = true }
hex.workspace = true
dashmap = "6.1"
bytes = "1.0"
image = "0.25"
num_cpus = "1.16"

# Native IMAP protocol binding (raisin.imap.*)
# async-imap (runtime-tokio) drives the IMAP protocol directly over a tokio
# AsyncRead/AsyncWrite stream; we supply a tokio-rustls TLS stream, reusing the
# workspace rustls 0.23 / tokio-rustls 0.26 stack (no extra TLS major).
async-imap = { version = "0.11", default-features = false, features = ["runtime-tokio"] }
mail-parser = "0.11"
tokio-rustls = "0.26"

# Native JWT/OIDC verification binding (raisin.crypto.verifyJwt). Pinned to the
# same 9.3 line the rest of the workspace already uses.
jsonwebtoken = "9.3"

# CSPRNG, SHA-2 digests and ECDSA P-256 for the raisin.crypto.* signing
# primitives (randomBytes / hash / generateKeyPair / signJwt). Already in the
# lockfile via raisin-crypto and jsonwebtoken, so this adds no new tree; it is
# named directly because ECDSA_P256_SHA256_FIXED_SIGNING is what emits the JOSE
# r||s signature JWS requires, and raisin-crypto does not re-export ring.
ring = "0.17"

# Dynamic loading of C-ABI function-binding plugins (see `plugin_loader`).
libloading = "0.8"
webpki-roots = "1.0"
# SMTP submission for the `smtp` email provider. rustls only — no OpenSSL /
# native-tls in the build, matching the IMAP client. `builder` is what composes
# the RFC 5322 message (MIME, encoding, Message-ID); hand-rolling that is how
# header-injection bugs get written.
lettre = { version = "0.11.23", default-features = false, features = ["tokio1", "tokio1-rustls-tls", "builder", "smtp-transport", "hostname", "ring"] }

# WebAssembly component runtime (feature `wasm`).
#
# VERSION PAIRING — wasmtime majors track rustc: 47.x declares MSRV 1.94.0 and
# the repo toolchain is pinned to 1.94.1 (`rust-toolchain.toml`), so 47 is the
# newest line that builds here. 48.x needs 1.95, 49.x needs 1.96. Each rustc
# bump unlocks exactly one wasmtime major; bump both together or not at all.
# Fallback if 47 ever has to be abandoned: the 36 LTS line.
#
# default-features = false keeps Winch, the GC proposals, the on-disk code
# cache, wat and coredump out of the link. `component-model-async` (WASI 0.3)
# is deliberately NOT enabled.
wasmtime = { version = "47", optional = true, default-features = false, features = [
    "runtime",
    "cranelift",
    "component-model",
    "async",
    "std",
    "backtrace",
    "addr2line",
    "demangle",
    "parallel-compilation",
    "pooling-allocator",
] }
# WASI p2 only. p1 (preview1 / wiggle) and p3 stay out.
wasmtime-wasi = { version = "47", optional = true, default-features = false, features = ["p2"] }

# Compiled-component cache (feature `wasm`). moka gives the weighted LRU the
# cache needs — compiled code is measured in MB, so an entry-count bound would
# be meaningless — and blake3 hashes the artifact bytes. The key is OUR hash and
# never the node's `content_hash`, which a tenant can write.
moka = { version = "0.12", optional = true, features = ["sync"] }
blake3 = { workspace = true, optional = true }

[features]
default = []
# WebAssembly component functions. Not default here: only raisin-server turns it
# on, so every other crate's tests keep building without Cranelift.
wasm = ["dep:wasmtime", "dep:wasmtime-wasi", "dep:moka", "dep:blake3"]

[dev-dependencies]
# Test-only: generate an ephemeral RSA keypair + JWK at runtime so no private
# key material is ever committed to the repo (see runtime/crypto tests).
rsa = { version = "0.9", features = ["pem"] }
rand = "0.8"
# Test-only: build a core (non-component) module in-test, to prove the runtime
# rejects one.
wat = "1"
# Test-only: ephemeral RocksDB job stores for scheduler callback tests.
tempfile = { workspace = true }
