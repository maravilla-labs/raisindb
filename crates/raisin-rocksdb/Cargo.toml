[package]
name = "raisin-rocksdb"
version = "0.1.0"
edition = "2021"
description = "RocksDB storage backend implementation for RaisinDB"
license = "MIT"

[lib]
path = "src/lib.rs"

[dependencies]
# Storage traits
raisin-storage = { path = "../raisin-storage" }
raisin-models = { path = "../raisin-models" }
# Geometry conversion + CRS. The spatial index normalises to WGS84 at write
# time using raisin-proj's built-in tier ONLY, so index bytes are identical
# in every build -- see raisin_proj::normalize_for_index.
raisin-geometry = { path = "../raisin-geometry" }
raisin-proj = { path = "../raisin-proj" }
raisin-validation = { path = "../raisin-validation" }
raisin-error = { path = "../raisin-error" }
raisin-context = { path = "../raisin-context" }
raisin-core = { path = "../raisin-core" }
raisin-crypto = { path = "../raisin-crypto" }
raisin-locks = { path = "../raisin-locks" }
# MCP wire types + outbound client. This is the crate the client half was split
# into precisely so storage-layer job handlers can use it: depending on
# `raisin-mcp` here would close the cycle
# raisin-functions -> raisin-rocksdb -> raisin-mcp -> raisin-functions.
raisin-mcp-protocol = { path = "../raisin-mcp-protocol" }
raisin-events = { path = "../raisin-events" }
raisin-embeddings = { path = "../raisin-embeddings" }
raisin-indexer = { path = "../raisin-indexer" }
raisin-hnsw = { path = "../raisin-hnsw" }
raisin-replication = { path = "../raisin-replication" }
raisin-binary = { path = "../raisin-binary" }
raisin-packages = { path = "../raisin-packages" }
raisin-audit = { path = "../raisin-audit" }

# RocksDB
# `bindgen-runtime` is part of rocksdb's default feature set and selects
# librocksdb-sys's bindgen backend. Turning defaults off without naming it
# leaves librocksdb-sys with NO backend, and its build script then panics
# with "a `libclang` shared library is not loaded on this thread" for any
# command that builds this crate alone (`cargo test -p raisin-rocksdb`).
# It only ever built because raisin-server takes rocksdb with defaults and
# feature unification papered over the gap.
rocksdb = { version = "0.24", default-features = false, features = ["lz4", "bindgen-runtime"] }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = "0.9"
rmp-serde = "1.3"
zip = "2.2"

# Async
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync"] }
tokio-util = "0.7"
tokio-stream = "0.1"
moka = { version = "0.12", features = ["sync"] }
futures = { workspace = true }
async-channel = "2.3"

# Authentication
bcrypt = "0.16"
jsonwebtoken = "9.3"
rand = "0.8"
sha2 = "0.10"

# Utilities
blake3 = { workspace = true }
chrono = { workspace = true }
# Recurrence expansion for the calendar occurrence projection
# (jobs/handlers/calendar_expand). See the workspace manifest for why.
rrule = { workspace = true }
chrono-tz = { workspace = true }
tracing = { workspace = true }
uuid = { version = "1.18.1", features = ["v4"] }
nanoid = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
num_cpus = "1.16"
fractional_index = "2.0"
hashbrown = { version = "0.14", features = ["serde"] }
tempfile = { workspace = true }
crc32fast = "1.4"
regex = "1"
mime_guess = "2.0"
either = "1.13"
lru = "0.12"
dashmap = "6.1"

# Geospatial indexing
geohash = { workspace = true }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }
async-trait = "0.1.89"
reqwest = { workspace = true, features = ["json"] }
urlencoding = "2.1.3"
url = { workspace = true }
raisin-hlc = { version = "0.1.0", path = "../raisin-hlc" }
# `ocr` is required, not incidental: the asset job OCRs images through
# `process_image_ocr`. The server build already had it — `raisin-functions`
# enables it unconditionally and Cargo unifies features across the graph — so
# this line changes nothing there. It matters for a standalone
# `-p raisin-rocksdb` build, where its absence silently swapped Tesseract for
# `NoOpOcrProvider`: the code compiled, the tests passed, and OCR did nothing.
raisin-ai = { version = "0.1.0", path = "../raisin-ai", features = ["huggingface", "candle", "ocr"] }
raisin-auth = { version = "0.1.0", path = "../raisin-auth" }
raisin-flow-runtime = { version = "0.1.0", path = "../raisin-flow-runtime" }
raisin-rel = { version = "0.1.0", path = "../raisin-rel" }
raisin-graph-algorithms = { version = "0.1.0", path = "../raisin-graph-algorithms" }
glob = "0.3.3"
arc-swap = "1.8.0"

[dev-dependencies]
raisin-core = { path = "../raisin-core" }
tempfile = { workspace = true }
tokio-test = "0.4"
criterion = { version = "0.5", features = ["async_tokio"] }
once_cell = "1.19"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures = "0.3"

[[bench]]
name = "rocksdb_benchmarks"
harness = false

[[bench]]
name = "persistent_idempotency_bench"
harness = false

[[bench]]
name = "spatial_index_bench"
harness = false
