name: default
description: Default workspace for general content
allowed_node_types:
  - raisin:Folder
  - raisin:Page
  - raisin:Asset
  # raisin:Event and raisin:Mail are what the calendar and mail connectors
  # materialize. A workspace REJECTS a node type absent from this list
  # ("Node type 'X' is not allowed in workspace 'default'"), so omitting one
  # here does not degrade the mount gracefully — it fails every write.
  - raisin:Event
  - raisin:Mail
  # The `submit` command types. Same reasoning, and the failure is worse: an
  # outbox mount whose type is missing here does not fail to SEND, it fails to
  # be composed into at all, so the operator sees a mount that works and a
  # compose UI that cannot save.
  - raisin:OutboundMail
  - raisin:CalendarAction
  - raisin:Node
allowed_root_node_types:
  - raisin:Folder
depends_on: []
config:
  default_branch: main
  node_type_pins: {}
