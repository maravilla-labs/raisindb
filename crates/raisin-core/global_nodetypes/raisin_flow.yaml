name: raisin:Flow
description: Visual workflow container for triggers and function execution
icon: workflow
# v2: `title` + `description` become searchable. `title` carried
# `index: [Fulltext]` from v1 but `index_types: [Property]` gated the type out
# before any field flag was read. "The flow that sends the refund email" is
# exactly how an author looks for one, so `description` also takes `Vector` —
# it is the one field holding the author's intent in prose. Flows are few and
# edited rarely, so the embedding cost is negligible; `Vector` is inert until an
# embedder is configured.
#
# `workflow_data` is NOT indexed: it is the step graph — ids, refs and inline
# scripts. It is the code, and code in a lexical index is noise.
version: 2
strict: true
indexable: true
index_types: [Property, Fulltext, Vector]
properties:
  - name: title
    type: String
    required: true
    title: Title
    description: Human-readable flow title
    index: [Fulltext]

  - name: name
    type: String
    required: true
    unique: true
    title: Flow Name
    description: Unique flow identifier
    index: [Property]

  - name: description
    type: String
    required: false
    title: Description
    description: Human-readable description of the workflow
    index: [Fulltext, Vector]

  - name: enabled
    type: Boolean
    required: false
    title: Enabled
    description: Whether the flow is active
    default: true
    index: [Property]

  - name: workflow_data
    type: Object
    required: false
    title: Workflow Data
    description: |
      Visual workflow definition containing nodes and their connections.

      Structure:
      {
        version: 1,
        error_strategy: "fail_fast" | "continue",
        nodes: [
          {
            id: "node_1",
            node_type: "raisin:FlowStep" | "raisin:FlowContainer",
            properties: { action, function_ref, lua_script, disabled },
            on_error: "stop" | "skip" | "continue"
          },
          {
            id: "container_1",
            node_type: "raisin:FlowContainer",
            container_type: "and" | "or" | "parallel" | "ai_sequence",
            rules: [{ condition, next_step }],
            children: [...]
          }
        ]
      }

  - name: timeout_ms
    type: Number
    required: false
    title: Timeout
    description: Maximum execution time in milliseconds
    default: 60000

allowed_children:
  - raisin:Trigger
  - raisin:Function
versionable: true
publishable: true
auditable: true
