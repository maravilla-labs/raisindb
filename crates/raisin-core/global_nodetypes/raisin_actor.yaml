name: raisin:Actor
description: Base type for all workflow participants (AI and Human actors)
icon: user-circle
# v2: opened the TYPE-LEVEL fulltext gate so `display_name` — flagged
# `index: [Fulltext]` since v1 — is actually indexed. `should_index_node`
# consults `index_types` BEFORE any per-field flag, so the flag was inert.
# ONLY the display name is fulltext: an actor's `actor_id`, `inbox_path`,
# `current_task_ref` and `supervisor_ref` are identifiers, and an identifier in
# a fulltext index is noise.
#
# NOTE for the subtypes: `index_types` is REPLACED, not merged, by a child that
# declares its own (node_type_resolver/resolution.rs step 6), so raisin:HumanActor
# and raisin:AIActor each needed the same widening — bumping only this base
# would have left both of them unindexed.
version: 2
abstract: true
indexable: true
index_types: [Property, Fulltext]
properties:
  - name: actor_id
    type: String
    required: true
    unique: true
    index: [Property]
    description: Unique identifier for this actor
  - name: display_name
    type: String
    required: true
    index: [Fulltext]
    description: Human-readable display name
  - name: capabilities
    type: Array
    required: false
    items:
      type: String
    description: Actions this actor can perform (approve, reject, review, execute, delegate, escalate, handoff, create_task, modify_context)
  - name: inbox_path
    type: String
    required: false
    description: Path where tasks for this actor are delivered
  - name: state
    type: String
    required: false
    default: idle
    description: Current availability state (idle, busy, unavailable, delegated)
  - name: current_task_ref
    type: String
    required: false
    description: Reference to currently assigned task
  - name: supervisor_ref
    type: String
    required: false
    description: Escalation target actor reference
  - name: metadata
    type: Object
    required: false
    description: Additional actor metadata
allowed_children:
  - raisin:ActorTask
  - raisin:Message
versionable: true
publishable: false
auditable: true
