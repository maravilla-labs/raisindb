name: raisin:MessageFolder
description: Container for user messages (inbox/outbox)
icon: mail
version: 1
indexable: false
properties:
  - name: data
    type: Object
    required: false
allowed_children:
  - raisin:Message
  - raisin:Conversation
  # Workflow human tasks are created at {assignee}/inbox/task-* - a user's
  # inbox folder holds chat artifacts AND inbox tasks.
  - raisin:InboxTask
versionable: false
publishable: false
auditable: false
