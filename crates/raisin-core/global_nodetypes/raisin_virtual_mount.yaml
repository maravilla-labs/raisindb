name: raisin:VirtualMount
description: Mounts an external system subtree into a workspace path
icon: hard-drive
version: 1
strict: true
indexable: true
index_types: [Property]
properties:
  - name: title
    type: String
    required: true
    title: Title
    description: Human-readable mount title

  - name: integration_ref
    type: String
    required: true
    title: Integration Reference
    description: Path of the raisin:Integration node backing this mount
    index: [Property]

  - name: account_ref
    type: String
    required: false
    title: Account Reference
    description: Identifier of the connected account (connected_accounts[].id)

  - name: target_workspace
    type: String
    required: true
    title: Target Workspace
    description: Workspace into which the external subtree is mounted
    index: [Property]

  - name: target_branch
    type: String
    required: true
    title: Target Branch
    default: main
    description: |
      Branch the mount materializes into. The mount's own configuration always
      lives on the repository's config (default) branch; this field selects the
      branch the synced virtual nodes are written to. A forked branch that carries
      a copy of this mount node is inert: the periodic scan only ever reads the
      config branch, so a copy never triggers a second sync.
    index: [Property]

  - name: mount_path
    type: String
    required: true
    title: Mount Path
    description: Path prefix inside the target workspace

  - name: remote_root
    type: String
    required: false
    title: Remote Root
    description: Provider-side root (folder id, mailbox, ...)

  - name: adapter_function
    type: String
    required: false
    title: Adapter Function
    description: Optional override of the integration's default adapter function

  - name: mapping_function
    type: String
    required: false
    title: Mapping Function
    description: Optional custom mapper function path

  - name: resolver_function
    type: String
    required: false
    title: Conflict Resolver Function
    description: |
      Function node consulted when the provider REFUSES a push because the
      object changed since this mount last read it. Selected by
      write_config.conflict: "resolver_function" — or simply by setting this
      path, which is unambiguous on its own.

      Invoked through the same plumbing as mapping_function (no separate
      executor, no separate workspace), with:

        { operation: "resolve_conflict", local, remote, conflict, base_etag,
          field_diff, mount }

      `remote` is always null: the adapter contract has no single-item `get`, so
      the provider's own refusal message in `conflict` is the only account of the
      remote side the engine has.

      It returns:

        { resolution: "local_wins" | "remote_wins" | "merged" | "park",
          fields?: { <property>: <value> },   // "merged" only
          reason?: string }                   // "park" only

      "merged" pushes those values and lands them on the node in the same write.
      Only properties inside the mount's effective write allow-list are accepted;
      anything else is dropped with a warning.

      Every unclear answer PARKS the edit (it stays pending, the mount reports
      writeback_status: "conflict"): a throw, an unrecognized resolution, or a
      "merged" carrying nothing this mount may push. Nothing is ever dropped
      silently.

      Like mapping_function and unlike adapter_function, this has NO
      integration-level fallback — a merge rule is a statement about one mount's
      data, not about a connector shared by twenty of them.

  - name: sync_config
    type: Object
    required: false
    title: Sync Configuration
    description: |
      Sync behaviour: {
        mode: "poll" | "webhook" | "hybrid",
        interval_seconds: 300,
        include_patterns: [], exclude_patterns: [],
        ephemeral: false, ttl_seconds: null, max_items_per_sync: 500,
        batch_size: 1000, batch_max_bytes: 4194304
      }

      batch_size / batch_max_bytes bound how many items share one transaction
      during an import. A batch commits as ONE revision, so this is what turns a
      per-item write (one revision, one branch-HEAD bump, one snapshot job and
      one replication record EACH) into one of each per batch.

      A batch flushes when EITHER bound is reached. Keep the byte budget: the
      replication layer stores a batch as a single record holding a full snapshot
      of every node in it, and one larger than the 10 MB transport frame cap
      would wedge a peer's sync. 1000 items with 20 KB mail bodies would be
      ~20 MB — the byte budget is what makes a large batch_size safe, so raise
      the two together or not at all.

  - name: write_config
    type: Object
    required: false
    title: Write Configuration
    description: |
      Writeback behaviour: {
        mode: "off" | "state_only",
        mutable_fields: ["unread", ...],
        writeback: "off" | "write_through",
        conflict: "remote_wins" | "local_wins" | "error" | "resolver_function"
      }
      conflict decides what a REFUSED push means — the provider saying the
      object changed since this mount read it. "remote_wins" (the default, and
      the pre-existing behaviour) abandons the local edit and lets the next sync
      overwrite it: a lost edit the user can redo. "local_wins" re-sends the push
      with no concurrency base, OVERWRITING the other writer irreversibly — never
      a default at any layer. "error" parks the edit and reports
      state.writeback_status: "conflict" until a human resolves it.
      "resolver_function" hands the decision to the mount's resolver_function
      (see that property). An unrecognized value REFUSES the whole drain rather
      than falling back, because both directions of a wrong guess lose data.
      mode is the write mode this mount drives, and it is a property of the
      MOUNT rather than of the adapter — the same connector serves a
      state_only inbox and a read-only archive. "state_only" pushes ONLY the
      properties named in mutable_fields through the adapter's update
      operation; the rest of the record is treated as immutable. An empty
      mutable_fields means nothing is pushable, and an unrecognized mode is
      treated as "off": a mount is never more writable than the engine
      understands it to be.
      The effective allow-list is the INTERSECTION of mutable_fields and the
      adapter's declared capabilities.mutable_fields, so an adapter that has
      not opted a field in cannot be made to accept it here.
      writeback: "write_through" asks for a full mirror (create/update/delete),
      which is not implemented yet and is reported as unsupported.

  - name: state
    type: Object
    required: false
    title: State
    description: |
      Engine-managed state (not user-edited): {
        last_sync_token, last_sync_at, last_error,
        consecutive_failures, status, writeback_supported,
        writeback_last_error, writeback_status
      }
      writeback_status is the OUTBOUND half's health, distinct from status
      (which is about reads): "conflict" means at least one edit is parked
      awaiting a human, "misconfigured" means the drain never started because
      write_config could not be resolved. Cleared by the first drain that parks
      nothing.
      status is one of "ok" | "syncing" | "auth_required" | "degraded" |
      "misconfigured". writeback_supported is false when the mount requests
      write_through writeback but the adapter does not declare the operations a
      mirror needs, OR its mapping_function cannot translate nodes back out (no
      mapping_function at all, or one without a to_external operation) —
      writability belongs to the mount, adapter and mapper together. It is
      absent when the mount never requested writeback at all — absent and
      false are NOT the same thing to the UI. writeback_last_error says what is
      missing, naming both the adapter and the mapper shortfall when both
      apply.
      A write_config.mode of "state_only" is judged the same way but against
      what state_only actually needs (can_write + can_update, a mapper that
      answers to_external, and a non-empty effective mutable_fields) — never
      against the create/delete a mirror would need.

  - name: enabled
    type: Boolean
    required: false
    title: Enabled
    description: Whether this mount is active
    default: true
    index: [Property]

allowed_children: []
versionable: false
publishable: false
auditable: true
