name: raisin:User
# A user home created by the engine lives at /users/internal/<user_key>, where
# user_key is u_ + 22 random base62 characters (raisin_models::auth::user_key):
# the path is the person's stable key, minted once and never moved or renamed.
# It says nothing about the person, so admins recognise people by title,
# display_name and email.
description: User account with authentication and authorization information
icon: person
version: 1
indexable: true
index_types: [Property, Fulltext]
properties:
  - name: user_id
    type: String
    required: false
    index: [Property]
    description: Links to tenant-level identity user (identity_id from auth system)
  - name: email
    type: String
    required: true
    unique: true
    index: [Property, Fulltext]
  - name: display_name
    type: String
    required: true
    index: [Fulltext]
  - name: title
    type: String
    required: false
    index: [Fulltext]
    description: What admin tools show for this user (the name, else the email); the home path is an opaque key
  - name: status
    type: String
    required: false
    default: active
    description: User status (active, inactive, deleted)
  - name: groups
    type: Array
    required: false
    items:
      type: String
  - name: roles
    type: Array
    required: false
    items:
      type: String
  - name: metadata
    type: Object
    required: false
  - name: birth_date
    type: Date
    required: false
    description: Date of birth for minor status calculation
  - name: can_login
    type: Boolean
    required: false
    default: true
    description: Whether user can authenticate (false for guardian-created accounts)
allowed_children:
  - raisin:Profile
  - raisin:MessageFolder
  - raisin:AclFolder
  - raisin:Folder
versionable: true
publishable: false
auditable: true
initial_structure:
  children:
    - name: profile
      node_type: raisin:Profile
    - name: inbox
      node_type: raisin:MessageFolder
    - name: outbox
      node_type: raisin:MessageFolder
    - name: sent
      node_type: raisin:MessageFolder
    - name: notifications
      node_type: raisin:AclFolder
