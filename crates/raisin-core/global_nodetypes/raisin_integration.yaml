name: raisin:Integration
description: Tenant/repo-level configuration for an external system integration
icon: plug
version: 1
strict: true
indexable: true
index_types: [Property]
properties:
  - name: title
    type: String
    required: true
    title: Title
    description: Human-readable integration title

  - name: provider_type
    type: String
    required: true
    title: Provider Type
    description: External provider identifier (google-drive, imap, sharepoint, custom, ...)
    index: [Property]

  - name: adapter_function
    type: String
    required: true
    title: Adapter Function
    description: Default adapter function path in the functions workspace

  - name: oauth_config
    type: Object
    required: false
    title: OAuth Configuration
    description: |
      OAuth client configuration: client_id, auth_url, token_url, scopes, redirect_uri.
      The client secret is stored ONLY as client_secret_encrypted, never here.

  - name: client_secret_encrypted
    type: String
    required: false
    title: Encrypted Client Secret
    description: base64(nonce||ciphertext), AES-256-GCM, encrypted with RAISIN_MASTER_KEY

  - name: api_config
    type: Object
    required: false
    title: API Configuration
    description: Non-OAuth providers - endpoints and key references

  - name: connected_accounts
    type: Array
    required: false
    title: Connected Accounts
    description: |
      List of connected accounts: [{ id, label, subject, expires_at, tokens_encrypted }].
      tokens_encrypted holds base64 AES-256-GCM of { access_token, refresh_token }.
      Refresh tokens never appear in plaintext; subject and expires_at stay plaintext.

  - name: capabilities
    type: Object
    required: false
    title: Capabilities
    description: |
      Adapter capability report, cached by the sync engine so the admin UI can
      read it without invoking the adapter: {
        can_read, can_write, can_create_folders, supports_changes,
        supports_webhooks, supports_search, supports_push,
        default_ttl, max_file_size
      }

  - name: capabilities_checked_at
    type: String
    required: false
    title: Capabilities Checked At
    description: ISO 8601 timestamp of the last capabilities probe

  - name: setup_instructions
    type: String
    required: false
    title: Setup Instructions
    description: |
      Markdown describing the external-side setup a user must perform on the
      provider (create an OAuth client, register the Redirect URI shown in the
      UI, grant scopes/permissions, paste the mount Notification URL, etc.).
      Surfaced read-only in the admin console; user-authored connectors ship
      their own.

  - name: docs_url
    type: String
    required: false
    title: Documentation URL
    description: Link to the provider's own setup documentation

  - name: enabled
    type: Boolean
    required: false
    title: Enabled
    description: Whether this integration is active
    default: true
    index: [Property]

allowed_children: []
versionable: false
publishable: false
auditable: true
