name: raisin:Integration
description: Tenant/repo-level configuration for an external system integration
icon: plug
version: 3
strict: true
indexable: true
index_types: [Property]
properties:
  - name: title
    type: String
    required: true
    title: Title
    description: Human-readable integration title

  - name: provider_type
    type: String
    required: true
    title: Provider Type
    description: External provider identifier (google-drive, imap, sharepoint, custom, ...)
    index: [Property]

  - name: adapter_function
    type: String
    required: true
    title: Adapter Function
    description: Default adapter function path in the functions workspace

  - name: oauth_config
    type: Object
    required: false
    title: OAuth Configuration
    description: |
      OAuth client configuration: client_id, auth_url, token_url, scopes, redirect_uri.
      The client secret is stored ONLY as client_secret_encrypted, never here.

  - name: client_secret_encrypted
    type: String
    required: false
    title: Encrypted Client Secret
    description: base64(nonce||ciphertext), AES-256-GCM, encrypted with RAISIN_MASTER_KEY

  - name: api_config
    type: Object
    required: false
    title: API Configuration
    description: |
      Non-OAuth providers - endpoints and key references. LEGACY: predates
      config_type. Kept forever (shipped templates use it) as the lowest layer
      of the config merge; new connectors should declare config_type instead.

  - name: config_type
    type: String
    required: false
    title: Connector Config Type
    description: |
      NodeType declaring this connector's CONNECTOR-LEVEL configuration fields
      (shared across all of its connections), e.g. "imap:ConnectorConfig".
      Ships with the adapter package and extends raisin:ConnectorConfig. The
      admin console renders it dynamically; values land in `config`, and any
      property carrying `meta.secret: true` is written through the
      config-secrets endpoint instead. Absent = the legacy hardcoded OAuth form.

  - name: connection_config_type
    type: String
    required: false
    title: Connection Config Type
    description: |
      NodeType declaring the PER-CONNECTION configuration fields, e.g.
      "imap:ConnectionConfig" (host/port/username/password) or
      "msgraph:ConnectionConfig" (tenant_id). Extends raisin:ConnectionConfig.
      Its values live on each connected_accounts[] entry, which is what lets one
      connector hold several independent connections.

  - name: oauth_config_type
    type: String
    required: false
    title: OAuth Config Type
    description: |
      NodeType describing the OAuth fields THIS CONNECTOR's operator actually
      owns, e.g. "acme:ProvisionedOAuthConfig". Values land in `oauth_config`;
      the server reads that object exactly as before, so this changes nothing
      but which fields the admin console offers.

      Absent = the console renders its built-in OAuth form (client id, secret,
      auth/token URL, scopes, redirect URI), which is the right surface when the
      operator registers the provider app themselves.

      Declare it when they do NOT. A connector whose client credentials are
      issued by a control plane, or by an upstream broker, ships a type with no
      credential properties: the console then offers nothing to edit and the
      operator is left with "Connect account". A deployment that pre-assigns
      client ids but lets operators choose scopes declares a type with just
      scopes. There is no "managed" flag — the schema IS the statement of what
      the operator owns, which is why this stays honest as new arrangements
      appear.

      Same mechanism as config_type / connection_config_type: resolved through
      NodeTypeResolver (so `extends` and mixins work) and rendered from `meta`
      hints. An unresolvable type degrades to the built-in form rather than
      rendering nothing.

  - name: config
    type: Object
    required: false
    title: Connector Configuration
    description: |
      Connector-level NON-SECRET configuration values, validated against
      config_type. Secrets never appear here - see config_secrets_encrypted.

  - name: config_secrets_encrypted
    type: String
    required: false
    title: Encrypted Connector Secrets
    description: |
      base64 AES-256-GCM of a { field: value } map holding every connector-level
      property flagged `meta.secret: true`. Write-only: set via the
      config-secrets endpoint, never returned by any read.

  - name: config_secret_fields
    type: Array
    required: false
    title: Connector Secret Field Names
    description: |
      Names ONLY of the fields present in config_secrets_encrypted, so the UI can
      render an "is set" indicator without decrypting anything.

  - name: connected_accounts
    type: Array
    required: false
    title: Connected Accounts
    description: |
      The connector's connections. One entry per account/connection, which is how
      a single connector holds several (two Entra tenants, two IMAP mailboxes):

        {
          id, label, subject, provider_type,
          auth_kind: "oauth" | "config",   # how this connection authenticates
          expires_at, tokens_encrypted,    # oauth only
          config: { ... },                 # per-connection, validated against
                                           #   connection_config_type
          secrets_encrypted,               # base64 AES-256-GCM { field: value }
          secret_fields: [ ... ],          # names only, for UI indicators
          created_at
        }

      tokens_encrypted holds base64 AES-256-GCM of { access_token, refresh_token }.
      Refresh tokens and per-connection secrets never appear in plaintext; label,
      subject, auth_kind, config, secret_fields and expires_at stay plaintext.
      All fields beyond id are optional, so pre-existing OAuth-only entries keep
      working unchanged.

  - name: capabilities
    type: Object
    required: false
    title: Capabilities
    description: |
      Adapter capability report, cached by the sync engine so the admin UI can
      read it without invoking the adapter: {
        can_read, can_write, can_create_folders, supports_changes,
        supports_webhooks, supports_search, supports_push, supports_browse,
        default_ttl, max_file_size,
        can_create, can_update, can_delete, can_submit, mutable_fields,
        default_delete_policy, default_move_policy, supports_trash,
        supports_idempotency_key
      }
      The trailing group is the write path; every one of those defaults to
      false/empty, so an adapter that omits them is treated as read-only.

  - name: capabilities_checked_at
    type: String
    required: false
    title: Capabilities Checked At
    description: ISO 8601 timestamp of the last capabilities probe

  - name: setup_instructions
    type: String
    required: false
    title: Setup Instructions
    description: |
      Markdown describing the external-side setup a user must perform on the
      provider (create an OAuth client, register the Redirect URI shown in the
      UI, grant scopes/permissions, paste the mount Notification URL, etc.).
      Surfaced read-only in the admin console; user-authored connectors ship
      their own.

  - name: docs_url
    type: String
    required: false
    title: Documentation URL
    description: Link to the provider's own setup documentation

  - name: enabled
    type: Boolean
    required: false
    title: Enabled
    description: Whether this integration is active
    default: true
    index: [Property]

allowed_children: []
versionable: false
publishable: false
auditable: true
