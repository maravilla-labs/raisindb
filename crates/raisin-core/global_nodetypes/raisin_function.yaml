name: raisin:Function
description: Serverless function definition for RaisinDB
icon: function-square
version: 2
strict: true
indexable: true
index_types: [Property]
properties:
  - name: title
    type: String
    required: true
    title: Title
    description: Human-readable function title
    index: [Fulltext]

  - name: name
    type: String
    required: false
    unique: true
    title: Function Name
    description: Unique function identifier (used in SQL calls and REST paths)
    index: [Property]

  - name: description
    type: String
    required: false
    title: Description
    description: Human-readable description of what the function does

  - name: language
    type: String
    required: true
    title: Language
    description: Runtime language (javascript, starlark, sql)
    index: [Property]

  - name: execution_mode
    type: String
    required: false
    title: Execution Mode
    description: How function can be executed (async, sync, both). Default is async.
    default: "async"

  - name: enabled
    type: Boolean
    required: false
    title: Enabled
    description: Whether function is active
    default: true
    index: [Property]

  - name: entry_file
    type: String
    required: false
    title: Entry File
    description: Entry point in format 'filename:function' (e.g., 'index.js:handler')
    default: "index.js:handler"

  - name: version
    type: Number
    required: false
    title: Version
    description: Function version number (incremented on updates)
    default: 1

  - name: resource_limits
    type: Object
    required: false
    title: Resource Limits
    description: |
      Resource constraints for function execution.
      Structure: { timeout_ms, max_memory_bytes, max_instructions, max_stack_bytes }

  - name: network_policy
    type: Object
    required: false
    title: Network Policy
    description: |
      HTTP access configuration.
      Structure: { http_enabled, allowed_urls, max_concurrent_requests, request_timeout_ms }

  - name: secret_policy
    type: Object
    required: false
    title: Secret Policy
    description: |
      Which secrets this function may reach through `raisin.secrets.*`.
      Structure: { enabled, allowed_names }

      Deny-by-default: an absent block, `enabled: false`, or an empty
      `allowed_names` all mean no access. `allowed_names` entries are globs
      matched against the resolved secret NAME, so a grant works whether the
      caller passes `stripe-key` or `secret://stripe-key@2`.

      This node type is `strict`, so the property has to be declared here
      before it can be set at all.

  - name: email_policy
    type: Object
    required: false
    title: Email Policy
    description: |
      Which recipients this function may send to through `raisin.email.*`.
      Structure: { enabled, allowed_recipients }

      Deny-by-default: an absent block, `enabled: false`, or an empty
      `allowed_recipients` all mean no sending. `allowed_recipients` entries are
      globs matched against the recipient DOMAIN (`example.com`,
      `*.example.com`, or `*` for any domain) — the sender identity is never a
      function's choice, it comes from the tenant's `/config/email` node.

      This node type is `strict`, so the property has to be declared here
      before it can be set at all.

  - name: triggers
    type: Array
    required: false
    title: Inline Triggers
    description: |
      Array of trigger conditions that invoke this function.
      Each trigger has: name, trigger_type, enabled, filters, priority

  - name: input_schema
    type: Object
    required: false
    title: Input Schema
    description: JSON Schema for validating function input

  - name: output_schema
    type: Object
    required: false
    title: Output Schema
    description: JSON Schema for validating function output

  - name: category
    type: String
    required: false
    title: Category
    description: Optional category tag for grouping functions (e.g., 'planning'). Used by agent handlers to detect tool capabilities.
    index: [Property]

  - name: metadata
    type: Object
    required: false
    title: Metadata
    description: Custom metadata for the function

  - name: mcp
    type: Object
    required: false
    title: MCP Tool
    description: |
      INBOUND. Do not confuse with `mcp_proxy` below, which is the opposite
      direction: `mcp` exposes THIS local function to external MCP clients,
      `mcp_proxy` marks a function that IS a remote server's tool.

      Optional MCP tool declaration. When present, the function is promoted to a
      tool on every raisin:McpServer whose data policy covers this function's
      workspace (and on every server, since the functions workspace is always
      scanned). A bare { enabled: true } is enough — every field is inherited from
      the function unless overridden.
      Structure: { enabled (bool, default true), name (string, defaults to the
      function name), description (string, defaults to the function description),
      inputSchema (object, defaults to the function input_schema), outputSchema
      (object, defaults to the function output_schema), scopes (array of strings) }

  - name: mcp_proxy
    type: Object
    required: false
    title: MCP Proxy
    description: |
      OUTBOUND. The opposite direction from `mcp` above.

      Present ONLY on a generated proxy for a remote MCP server's tool. Marks
      this function as having NO CODE: invocation is forwarded to the named
      raisin:McpConnection's remote tool instead of a QuickJS/Starlark runtime.
      Its presence — not `language` or `execution_mode` — is what the executor
      branches on, because an unrecognised execution_mode silently parses as
      "async" and an unrecognised language is a hard error.

      Managed by tool discovery; hand edits are overwritten on the next refresh.
      Structure: { connection (path of the raisin:McpConnection node),
                   connection_slug, remote_tool (the VERBATIM remote name — the
                   only thing sent in tools/call, never derived from the local
                   slug), schema_hash, discovered_at,
                   state: "active" | "missing" | "conflict" }

allowed_children:
  - raisin:Asset
  - raisin:Folder
versionable: true
publishable: true
auditable: true
