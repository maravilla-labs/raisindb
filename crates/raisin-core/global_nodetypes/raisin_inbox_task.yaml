name: raisin:InboxTask
description: Task awaiting user action in human-in-the-loop workflows
icon: inbox
# v3: flow_instance_ref/step_id made optional (standalone raisin.tasks.create
# tasks have no owning flow) + declared the assignee/flow_instance_id/due_at/
# due_in_seconds/created_at/completed_by properties the writers actually set
# (the type is strict). The version bump drives the startup global-NodeType
# resync so existing repositories pick up the relaxed schema on upgrade.
# (v3, not v2: some existing repos already registered a v2 InboxTask that still
# had the OLD strict schema — jumping past it forces the relaxed schema to win.)
# v4: added the `data` Object slot — an arbitrary structured payload the task UI
# renders (e.g. the linked-site conflict change set the Inbox tree reads). Both
# raisin.tasks.create and the human_task flow step persist it; without a declared
# property the strict type silently dropped `data` on write. Bump forces resync.
# v5: dropped the closed `enum` on task_type. approval/input/review/action stay
# the canonical types the runtime understands semantically, but an application
# may define its own task vocabulary (e.g. a triage or dispatch type) without an
# engine change; the writers validate the SHAPE of the slug instead of the set.
# Bump forces resync so existing repositories accept custom types on upgrade.
# v6: declared the GROUP-ASSIGNMENT slots. A human_task step addressed to a
# raisin:Group is expanded into one correlated task per member, and the
# completion API aggregates them (any/all/quorum, narrowed by an optional REL
# `response_condition`) before resuming the flow once. That correlation lives on
# the task nodes themselves — undeclared, a strict type drops it silently and
# every member's answer would resume the flow independently. Bump forces resync.
# v7: made the task TITLE and DESCRIPTION actually searchable. `title` has
# carried `index: [Fulltext]` since v1, but the TYPE-LEVEL gate was
# `index_types: [Property]`, and `IndexingPolicy::should_index_node` consults
# that gate first — so the per-field flag was inert and no inbox task was ever
# in the fulltext index. Finding a task by what it says is the whole point of an
# inbox. Fulltext ONLY, deliberately no `Vector`: a group `human_task` mints one
# task per member per step, so tasks are the highest-volume node here, and an
# embedding job per task buys little over lexical search on a short title.
# Bump forces the resync so existing repositories pick the gate up.
version: 7
strict: true
indexable: true
index_types: [Property, Fulltext]
properties:
  - name: task_type
    type: String
    required: true
    title: Task Type
    description: >-
      Type of task requiring user action. Canonical values understood by the
      workflow runtime are approval, input, review and action; any other slug
      matching [a-z][a-z0-9_-]{0,63} is an application-defined type and is
      carried through verbatim for the task UI to dispatch on.
    index: [Property]

  - name: title
    type: String
    required: true
    title: Title
    description: Human-readable task title
    index: [Fulltext]

  - name: description
    type: String
    required: false
    title: Description
    description: Detailed description of the task
    index: [Fulltext]

  # Optional: a standalone task (raisin.tasks.create) has no owning flow, so
  # neither this Reference nor step_id can be required. The flow human_task
  # step links back via the String flow_instance_id below (the runtime reads
  # that, not this Reference), so this stays as an optional forward-compat slot.
  - name: flow_instance_ref
    type: Reference
    required: false
    title: Flow Instance Reference
    description: Reference to raisin:FlowInstance waiting for response
    index: [Property]

  - name: step_id
    type: String
    required: false
    title: Step ID
    description: ID of the flow step that created this task (flow tasks only)
    index: [Property]

  # Assignee HOME path (e.g. "/users/internal/admin-at-example-local"). Both the
  # human_task step and raisin.tasks.create write this; complete_task /
  # list_inbox_tasks authorize and filter on it.
  - name: assignee
    type: String
    required: false
    title: Assignee
    description: Home path of the user/agent the task is assigned to
    index: [Property]

  # String id of the owning flow instance (flow human_task tasks only). The
  # completion path reads this to resume the parked flow. Kept as a String (not
  # the flow_instance_ref Reference) to match every actual writer/reader.
  - name: flow_instance_id
    type: String
    required: false
    title: Flow Instance ID
    description: Id of the raisin:FlowInstance this task resumes on completion
    index: [Property]

  - name: options
    type: Array
    required: false
    title: Options
    description: |
      Available response options for the user.
      Structure: [
        { value: "approve", label: "Approve", style: "success" },
        { value: "reject", label: "Reject", style: "danger" }
      ]

  - name: input_schema
    type: Object
    required: false
    title: Input Schema
    description: JSON Schema for validating required user input

  - name: due_date
    type: Date
    required: false
    title: Due Date
    description: When the task is due
    index: [Property]

  - name: priority
    type: Number
    required: false
    title: Priority
    description: Task priority (1-5, where 1 is highest priority)
    default: 3
    index: [Property]

  - name: status
    type: String
    required: true
    title: Status
    description: Current status of the task
    enum: [pending, completed, expired, cancelled]
    default: pending
    index: [Property]

  - name: data
    type: Object
    required: false
    title: Data
    description: |
      Arbitrary structured payload carried by the task for its UI to render
      (e.g. the linked-site conflict change set the Inbox conflict tree reads:
      { kind, copy_root, workspace, change_key, changes: [SyncEntry] }). Opaque
      to the task framework; written by raisin.tasks.create and the human_task
      flow step, read back verbatim via the inbox listing.

  - name: response
    type: Object
    required: false
    title: Response
    description: User's response to the task

  - name: responded_at
    type: Date
    required: false
    title: Responded At
    description: When the user responded to the task
    index: [Property]

  # Absolute due/wait deadline, materialized from due_in_seconds by the
  # human_task step and (when supplied) by raisin.tasks.create. Used for the
  # inbox sort order and overdue display.
  - name: due_at
    type: Date
    required: false
    title: Due At
    description: Absolute time the task is due (materialized from due_in_seconds)
    index: [Property]

  - name: due_in_seconds
    type: Number
    required: false
    title: Due In Seconds
    description: Relative deadline in seconds (source for due_at)

  - name: created_at
    type: Date
    required: false
    title: Created At
    description: When the task was created

  # --- Group assignment (human_task addressed to a raisin:Group) ---------
  # Written by the human_task step for every member's task, read back by
  # complete_task to decide whether the authored completion policy is met.

  - name: assignment_id
    type: String
    required: false
    title: Assignment ID
    description: Correlates the tasks created for one group wait of one flow step
    index: [Property]

  - name: assignment_group
    type: String
    required: false
    title: Assignment Group
    description: Path of the raisin:Group this task was expanded from
    index: [Property]

  - name: assignment_completion
    type: String
    required: false
    title: Assignment Completion
    description: Completion policy for the group wait (any, all or quorum)

  - name: assignment_required
    type: Number
    required: false
    title: Assignment Required
    description: Number of QUALIFYING responses that satisfy the group wait

  - name: assignment_total
    type: Number
    required: false
    title: Assignment Total
    description: Number of members the wait was delivered to

  - name: assignment_task_paths
    type: Array
    required: false
    title: Assignment Task Paths
    description: Every correlated task path in this group wait, including this one

  - name: response_condition
    type: String
    required: false
    title: Response Condition
    description: >-
      Optional REL over `response` and `responses` deciding whether a response
      COUNTS towards the group policy (e.g. only an accept qualifies).

  - name: qualifies
    type: Boolean
    required: false
    title: Qualifies
    description: Whether this response counted towards the group completion policy

  - name: cancellation_reason
    type: String
    required: false
    title: Cancellation Reason
    description: Why a pending task was cancelled (e.g. group_completed)

  - name: completed_by
    type: String
    required: false
    title: Completed By
    description: Identifier of the principal (user/agent) who completed the task
    index: [Property]

allowed_children: []
versionable: true
publishable: false
auditable: true
