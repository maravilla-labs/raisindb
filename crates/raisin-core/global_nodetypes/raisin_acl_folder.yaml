name: raisin:AclFolder
description: Access control folder for organizing users, roles, and groups
icon: shield
version: 3
extends: raisin:Folder
indexable: true
index_types: [Fulltext]
properties:
  - name: icon
    type: String
    title: Icon
    description: Lucide icon name for the folder
    required: false
    default: "folder"
  - name: color
    type: String
    title: Color
    description: Background color for the folder (hex code)
    required: false
    default: "#3b82f6"
# Keep this aligned with access_control.yaml allowed_node_types. The workspace
# says which types may exist; this list says those types may live under the ACL
# folders shipped in the workspace's initial_structure and built-in packages.
allowed_children:
  - raisin:User
  - raisin:Role
  - raisin:Group
  - raisin:AclFolder
  - raisin:Folder
  # /relation-types, /circles, /graph-config.
  - raisin:RelationType
  - raisin:EntityCircle
  - raisin:GraphAlgorithmConfig
  - raisin:StewardshipOverride
  # /config.
  - raisin:SecurityConfig
  - raisin:StewardshipConfig
  # User-owned subtrees under /users/internal/<slug>.
  - raisin:Profile
  - raisin:ProfileData
  - raisin:MessageFolder
  - raisin:Message
  - raisin:Conversation
  - raisin:InboxTask
  - raisin:Notification
  # /visitors/<key>: anonymous chat sessions (raisin-messaging). Named here
  # although it extends raisin:Folder: the update path checks the list by
  # the child's own type.
  - raisin:VisitorSession
  # raisin:system initial_structure (system.yaml): /config holds the auth and
  # email config and /config/repos the per-repo RepoAuthConfig nodes;
  # /providers, /identities, /sessions, /tokens and /access hold the rest.
  # Without these the structure fails validation and /config/repos is never
  # created, so provisioning cannot write RepoAuthConfig for a new tenant.
  - raisin:AuthConfig
  - raisin:RepoAuthConfig
  - raisin:EmailConfig
  - raisin:ProviderConfig
  - raisin:Identity
  - raisin:Session
  - raisin:OneTimeToken
  - raisin:WorkspaceAccess
versionable: true
publishable: true
auditable: true
