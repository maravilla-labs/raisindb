name: raisin:Package
description: Installable package with node types, workspaces, and content
icon: package
# v2: added `sync_policy` (commit 5bfb544). The bump is REQUIRED — init.rs only
# re-applies a global NodeType to already-existing repos when new_version >
# existing_version, so leaving this at 1 left pre-existing tenants on the old
# strict schema and they 400'd package uploads carrying `sync_policy`.
# v3: `keywords` gains `Fulltext`. The gate and `title`/`description` were
# already right; keywords existed to be searched and were reachable only by an
# exact property predicate. Nothing else changes — `content_hash`,
# `upload_state`, `teaser_background_url` and the rest are machine fields.
# v5/v6: `migrations` and `applied_migrations`. The upload processor and the
# installer have written both since package migrations landed, but the strict
# schema never declared them, so the first package that shipped a migration
# failed to install ("Undefined property 'migrations' in strict mode").
version: 6
strict: true
indexable: true
index_types: [Property, Fulltext]
versionable: true
publishable: true
auditable: true
properties:
  - name: name
    type: String
    required: true
    title: Package Name
    description: Package identifier (e.g., 'ai-tools', 'analytics'). Path provides uniqueness.
    index: [Property]

  - name: version
    type: String
    required: true
    title: Version
    description: Semantic version string (e.g., '1.0.0')

  - name: title
    type: String
    required: false
    title: Title
    description: Human-readable package title
    index: [Fulltext]

  - name: description
    type: String
    required: false
    title: Description
    description: Human-readable description of the package
    index: [Fulltext]

  - name: author
    type: String
    required: false
    title: Author
    description: Package author or organization
    index: [Property]

  - name: license
    type: String
    required: false
    title: License
    description: License identifier (e.g., 'MIT', 'Apache-2.0')

  - name: icon
    type: String
    required: false
    title: Icon
    description: Lucide icon name for UI display (e.g., 'package', 'bot', 'sparkles')
    default: "package"

  - name: color
    type: String
    required: false
    title: Color
    description: Hex color for UI display (e.g., '#6366F1')
    default: "#6366F1"

  - name: keywords
    type: Array
    required: false
    title: Keywords
    description: Keywords for search and filtering (e.g., ['ai', 'agents', 'chat'])
    index: [Property, Fulltext]

  - name: category
    type: String
    required: false
    title: Category
    description: Package category (e.g., 'ai', 'integrations', 'utilities')
    index: [Property]

  - name: dependencies
    type: Array
    required: false
    title: Dependencies
    description: |
      Array of package dependencies.
      Structure: [{ name: string, version: string }]

  - name: provides
    type: Object
    required: false
    title: Provides
    description: |
      What this package provides.
      Structure: { nodetypes: string[], workspaces: string[], content: string[] }

  - name: workspace_patches
    type: Object
    required: false
    title: Workspace Patches
    description: |
      Modifications to existing workspaces.
      Structure: { [workspace]: { allowed_node_types: { add: string[] } } }

  - name: installed
    type: Boolean
    required: false
    title: Installed
    description: Whether the package has been installed to this repository
    default: false
    index: [Property]

  - name: installed_at
    type: Date
    required: false
    title: Installed At
    description: When the package was installed

  - name: content_hash
    type: String
    required: false
    title: Content Hash
    description: >
      Hash of the embedded package content this node was registered from. The
      boot-time registrar compares it against the current build to decide
      whether a builtin package needs re-registering. Without it, an
      `auto_install: false` package (the provider connectors) was skipped on
      every boot once registered, so a rebuilt adapter never reached the repo —
      a connector fix could ship to a server and still not run.
    index: [Property]

  - name: upload_state
    type: String
    required: false
    title: Upload State
    description: Whether this is a new package or an update (new, updated)
    default: "new"
    index: [Property]

  - name: teaser_background_url
    type: String
    required: false
    title: Teaser Background URL
    description: URL to teaser background image from static/teaser_background.png or .jpg

  - name: status
    type: String
    required: false
    title: Status
    description: Processing status of the package (processing, ready, error)
    default: "ready"
    index: [Property]

  - name: progress
    type: Number
    required: false
    title: Processing Progress
    description: Upload/processing progress (0.0 to 1.0)
    default: 0.0

  - name: large_upload
    type: Boolean
    required: false
    title: Large Upload
    description: Whether this package was uploaded via large file streaming (internal flag)
    default: false

  # OBJECT, NOT Resource — and the distinction is real rather than pedantic.
  #
  # A `PropertyValue::Resource` is an uploaded FILE: it carries a `uuid`, a
  # `created_at` and an `updated_at`, and that is the shape `raisin:Asset.file`
  # holds. A package archive is not one of those. `package_registration.rs`
  # writes `{key, url, mime_type, size}` — the object-storage BLOB KEY and
  # nothing else — and reads it straight back as an Object
  # (`Some(PropertyValue::Object(obj)) => obj.get("key")`). There is no uuid to
  # put in a Resource and no timestamps, so this value could never have been one.
  #
  # While `type:` was documentation the mismatch was invisible. Once 0.6.1
  # enforced declared types it made the server REFUSE ITS OWN PACKAGE UPLOAD —
  # every `raisindb deploy` failed with "Property 'resource' on NodeType
  # 'raisin:Package' is declared Resource but the value is Object", which blocks
  # all package installation. Declaring what is actually stored fixes it without
  # loosening the check for everything else: measured against a live tenant,
  # every OTHER Resource-declared property really does hold a full Resource.
  - name: resource
    type: Object
    required: true
    title: Package Archive
    description: The .rap ZIP file containing package contents
    
  - name: builtin
    type: Boolean
    required: false
    title: Builtin Package
    description: Whether the package is a builtin sytem package
    default: false
    index: [Property]

  - name: migrations
    type: Array
    required: false
    title: Migrations
    description: |
      The package's migrations/*.yaml as last seen: written by the upload
      processor, and the installer records each one's status as it runs.
      Structure: [{ id: string, path: string, title?: string, hash?: string,
      status?: string, operations: integer }]

  - name: applied_migrations
    type: Array
    required: false
    title: Applied Migrations
    description: |
      The installer's ledger of migrations already applied to this
      installation, keyed by id and content hash, so a migration runs once.
      Structure: [{ id: string, hash: string, status: string }]

  - name: sync_policy
    type: Object
    required: false
    title: Sync Policy
    description: |
      Summary of the package's optional .raisin-sync.yaml per-path
      install/reconciliation policy, if it ships one at its root. Set at
      upload time so the admin console can show a "Custom Sync Policy"
      badge without running a dry run.
      Structure: { default_mode: string, filters: [{ root: string, mode?: string }] }
allowed_children:
  - raisin:Asset
  - raisin:Folder
