name: raisin:EmailMessage
description: >-
  One record per message a provider ACCEPTED through raisin.email.send. It is
  the correlation anchor for later provider feedback (delivered, bounced,
  blocked, complained): `message_id` is what a webhook payload names.
  `status` starts at `accepted` and only ever advances.
icon: mail
# v2: `accepted_at`/`last_event_at` corrected from `String` to `Date`, as `raisin:Mail` v4 did.
# The server writes them as RFC3339 (`occurred_at` is normalised from the
# provider's timestamp, or left out when it carries no zone), and a `Date`
# declaration is what every other built-in `_at` property says.
# `coerce_declared_dates` parses the stored string spelling on the next write,
# so no migration. The type change is classified breaking, so an existing repo
# keeps `String` until an admin applies it; writes keep working either way
# (`coerce_dates_declared_as_string` covers the old declaration).
version: 2
strict: false
indexable: true
index_types: [Property]
# Written on every send; history would triple the cost for no benefit.
versionable: false
publishable: false
auditable: false
properties:
  - name: provider
    type: String
    required: true
    index: [Property]
    meta:
      label: Provider
      description: "resend | brevo | smtp"

  - name: sender
    type: String
    required: false
    meta:
      label: Sender name
      description: The configured sender entry this was sent through.

  - name: message_id
    type: String
    required: true
    index: [Property]
    meta:
      label: Provider message id
      description: >-
        The id the provider returned. Provider webhooks correlate on this.

  - name: to
    type: Array
    required: false
    meta:
      label: Recipients
      description: To addresses only; cc and bcc are deliberately not stored.

  - name: subject
    type: String
    required: false

  - name: status
    type: String
    required: true
    default: accepted
    index: [Property]
    meta:
      label: Status
      description: >-
        accepted | deferred | delivered | soft_bounce | hard_bounce | blocked |
        complained. Advances monotonically; terminal states are never
        overwritten by an earlier-stage event.

  - name: correlation_kind
    type: String
    required: false
    index: [Property]
    meta:
      label: Correlation kind
      description: Caller-defined, e.g. "message-delivery".

  - name: correlation_id
    type: String
    required: false
    index: [Property]
    meta:
      label: Correlation id
      description: Caller-defined id, e.g. the delivery node id.

  - name: accepted_at
    type: Date
    required: false

  - name: last_event_at
    type: Date
    required: false

  - name: last_error
    type: String
    required: false
