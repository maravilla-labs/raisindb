name: raisin:EmailConfig
description: Per-tenant outbound email (transactional) configuration
icon: mail
version: 1
strict: false
indexable: true
index_types: [Property]
# Mirrors raisin:RepoAuthConfig: a config node is worth revisions (so a bad
# edit to the sender identity or the redirect allowlist can be traced and
# rolled back) and worth an audit trail, but it is never published - it is
# operator configuration, not content.
versionable: true
publishable: false
auditable: true
# No property carries an index: this node is addressed by path
# (/config/email in raisin:system), never looked up by a property value.
properties:
  - name: enabled
    type: Boolean
    required: false
    title: Enabled
    description: Whether outbound email is enabled for this tenant
    # Deny by default. A tenant that has never been configured must not be
    # able to send, and must not fall back to some other tenant's sender.
    default: false

  - name: provider
    type: String
    required: false
    title: Provider
    description: Transactional email provider to send through
    # v1 ships HTTP providers only - the sandbox has no raw TCP, so SMTP is
    # deliberately absent, and adding `smtp` here is the whole schema change
    # that direction needs. Note that `enum` is declarative, exactly as in the
    # sibling nodetypes: PropertyValueSchema does not carry it, so it documents
    # the accepted values for authors and tooling - the sending path still has
    # to reject an unknown provider itself.
    enum: [resend, brevo]
    default: resend

  - name: from_address
    type: String
    required: false
    title: From Address
    description: Envelope/header sender address (must be verified with the provider)

  - name: from_name
    type: String
    required: false
    title: From Name
    description: Display name shown alongside the sender address

  - name: reply_to
    type: String
    required: false
    title: Reply-To
    description: Address replies are directed to, if different from the sender

  - name: api_base
    type: String
    required: false
    title: API Base URL
    description: >
      Override for the provider's API base URL. Left unset the provider's
      documented default is used; set it to point at a regional endpoint or,
      in tests, at a local stub.

  - name: credential_ref
    type: String
    required: false
    title: Credential Reference
    description: >
      Reference to the provider API key in the secret store, e.g.
      "secret://email/api_key". The key itself is NEVER stored on this node -
      config nodes are versioned, auditable and readable by anyone with read
      access to /config, and a secret would leak through every one of those.
    default: "secret://email/api_key"

  - name: base_url
    type: String
    required: false
    title: Base URL
    description: >
      Origin that outbound links (magic links in particular) are built from,
      e.g. "https://app.example.com". This is explicit configuration and is
      NEVER derived from the request's Host/Origin header: an attacker who can
      set those headers could otherwise poison a link so that the victim's
      one-time token is delivered to the attacker's host.

  - name: redirect_allowlist
    type: Array
    required: false
    title: Redirect Allowlist
    description: >
      Redirect URLs a caller may request after a magic link is verified. A
      caller-supplied redirect_url must match an entry here (and stay within
      base_url) or it is refused - an unchecked redirect turns the verify
      endpoint into an open redirect that carries the session with it.
    default: []
allowed_children: []
