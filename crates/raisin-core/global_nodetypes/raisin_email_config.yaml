name: raisin:EmailConfig
description: Per-tenant outbound email (transactional) configuration
icon: mail
version: 1
strict: false
indexable: true
index_types: [Property]
# Mirrors raisin:RepoAuthConfig: a config node is worth revisions (so a bad
# edit to the sender identity or the redirect allowlist can be traced and
# rolled back) and worth an audit trail, but it is never published - it is
# operator configuration, not content.
versionable: true
publishable: false
auditable: true
# No property carries an index: this node is addressed by path
# (/config/email in raisin:system), never looked up by a property value.
properties:
  - name: enabled
    type: Boolean
    required: false
    title: Enabled
    description: >
      Master switch for the whole tenant. Off means no configured provider
      sends, however many there are.
    # Deny by default. A tenant that has never been configured must not be
    # able to send, and must not fall back to some other tenant's sender.
    default: false

  - name: providers
    type: Array
    required: false
    title: Providers
    description: >
      The configured senders. Each entry is complete on its own:

        name           unique slug a function names, e.g. "transactional"
        provider       resend | brevo | smtp
        from_address   sender address, verified with THAT entry's account
        from_name      optional display name
        reply_to       optional Reply-To
        credential_ref secret:// reference to this entry's API key or SMTP
                       password - NEVER the key itself
        api_base       optional provider API base override (HTTP providers)
        smtp           { host, port, username, security } when provider=smtp;
                       security is starttls | tls | none, port defaults to 587
        enabled        per-entry switch, default true
        default        marks the entry system mail goes through
        attachments    optional bounds for this sender:
                       { max_count, max_bytes_each, max_total_bytes }.
                       Absent fields keep the defaults (20 attachments,
                       10 MiB each, 10 MiB total, decoded). Raising
                       max_total_bytes should come with a longer send
                       timeout - the 30s per-send budget covers the upload
                       too, so too high a cap turns a clean rejection into
                       a timeout part-way through sending.

      Empty means this tenant cannot send. There is deliberately no implicit
      sender and no platform fallback account: mail either goes out as somebody
      this tenant configured, or it does not go out.
    default: []

  - name: default_provider
    type: String
    required: false
    title: Default Provider
    description: >
      Name of the entry in `providers` that system mail - magic-link sign-in
      above all - goes through, and the one a function gets when it names none.
      Redundant with a single configured provider, or with one carrying
      `default: true`; when both are present this wins, so moving the default
      is a one-field edit rather than two that can disagree.

  - name: base_url
    type: String
    required: false
    title: Base URL
    description: >
      Origin that outbound links (magic links in particular) are built from,
      e.g. "https://app.example.com". This is explicit configuration and is
      NEVER derived from the request's Host/Origin header: an attacker who can
      set those headers could otherwise poison a link so that the victim's
      one-time token is delivered to the attacker's host.

  - name: redirect_allowlist
    type: Array
    required: false
    title: Redirect Allowlist
    description: >
      Redirect URLs a caller may request after a magic link is verified. A
      caller-supplied redirect_url must match an entry here (and stay within
      base_url) or it is refused - an unchecked redirect turns the verify
      endpoint into an open redirect that carries the session with it.
    default: []
allowed_children: []
