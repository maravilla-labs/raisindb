[package]
name = "raisin-server"
version = "0.3.32"
edition = "2021"
description = "RaisinDB server binary"
license = "BSL-1.1"

# jemalloc as the global allocator on Unix: returns freed pages to the OS
# (dirty-page decay + background purge threads on Linux) and resists the
# arena fragmentation that glibc malloc accumulates under the per-execution
# allocation churn of the function runtime (19GB RSS on prod, 2026-07).
# background_threads is Linux-only in tikv-jemallocator.
#
# `profiling` / `stats` compile jemalloc's heap profiler and stats counters IN
# but leave them INACTIVE — they cost effectively nothing until switched on at
# runtime. Without them the `prof:*` / `stats_print` options are not merely
# ignored, they are rejected outright ("<jemalloc>: Invalid conf pair:
# prof:true"), so an RSS investigation on a running server has no instrument at
# all and needs a fresh release before it can even start. That is exactly what
# happened chasing the 9.3 GB plateau (2026-08); keep them compiled in.
#
# Activate at runtime via the PREFIXED env var — tikv-jemalloc builds jemalloc
# with the `_rjem_` prefix, so plain `MALLOC_CONF` is silently NOT read:
#   _RJEM_MALLOC_CONF=prof:true,prof_active:true,lg_prof_sample:19,prof_prefix:/path/jeprof
# Add `abort_conf:true` when testing a conf string — invalid pairs are ignored
# with only a stderr line otherwise, which reads exactly like "it worked".
#
# `tikv-jemalloc-ctl` is what finally READS those counters from inside the
# process. Compiling `stats` in without it left the server unable to report a
# single number about its own heap, so an RSS investigation could only watch
# cgroup RSS from outside and guess at the mechanism. See
# `src/diagnostics/allocator.rs`.
[target.'cfg(target_os = "linux")'.dependencies]
tikv-jemallocator = { version = "0.6", features = [
    "background_threads",
    "profiling",
    "stats",
] }
tikv-jemalloc-ctl = { version = "0.6", features = ["stats"] }
# For `malloc_stats_print`, which jemalloc-ctl does not wrap. Declared here
# rather than hand-writing the `extern "C"` block because the symbol is
# `_rjem_`-PREFIXED in this build (see the note above) and the sys crate already
# carries the correct `link_name` for both prefixed and unprefixed builds.
tikv-jemalloc-sys = { version = "0.6", features = ["stats"] }
libc = "0.2"

[target.'cfg(all(unix, not(target_os = "linux")))'.dependencies]
tikv-jemallocator = "0.6"

[dependencies]
tokio = { workspace = true }
tokio-util = "0.7"
axum = { workspace = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
raisin-transport-http = { path = "../raisin-transport-http" }
# For the [mcp_client] config section; the type lives next to the egress policy
# it configures rather than being mirrored here.
raisin-mcp = { path = "../raisin-mcp" }
raisin-transport-ws = { path = "../raisin-transport-ws", optional = true }
raisin-transport-pgwire = { path = "../raisin-transport-pgwire", optional = true }
raisin-storage = { path = "../raisin-storage" }
raisin-storage-memory = { path = "../raisin-storage-memory", optional = true }
raisin-rocksdb = { path = "../raisin-rocksdb", optional = true }
raisin-replication = { path = "../raisin-replication", optional = true }
rocksdb = { version = "0.24", optional = true }
raisin-indexer = { path = "../raisin-indexer", optional = true }
raisin-hnsw = { path = "../raisin-hnsw", optional = true }
raisin-embeddings = { path = "../raisin-embeddings", optional = true }
raisin-sql-execution = { path = "../raisin-sql-execution", optional = true }
raisin-binary = { path = "../raisin-binary" }
raisin-core = { path = "../raisin-core" }
raisin-context = { path = "../raisin-context" }
raisin-audit = { path = "../raisin-audit" }
raisin-error = { path = "../raisin-error" }
raisin-events = { path = "../raisin-events" }
raisin-models = { path = "../raisin-models" }
uuid = { workspace = true, features = ["v4"] }
bcrypt = "0.16"
jsonwebtoken = "9.3"
rand = "0.8"
rust-embed = { workspace = true }
mime_guess = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = "0.1.89"
futures = "0.3"
futures-util = "0.3"
bytes = "1.0"
tokio-stream = "0.1"
async-stream = "0.3"
chrono = { workspace = true }
nanoid = "0.4"
serde_yaml = "0.9"
anyhow = "1.0"
rmp-serde = { workspace = true }
clap = { version = "4.5", features = ["derive", "env"] }
toml = "0.8"
pgwire = { version = "0.25", optional = true }
raisin-functions = { path = "../raisin-functions", optional = true }
reqwest = { workspace = true, features = ["json"] }
raisin-ai = { version = "0.1.0", path = "../raisin-ai" }
raisin-packages = { path = "../raisin-packages" }
raisin-hlc = { path = "../raisin-hlc" }
raisin-locks = { path = "../raisin-locks" }
raisin-deps = { path = "../raisin-deps" }
include_dir = "0.7"
zip = "2.2"
base64 = { workspace = true }

[[bin]]
name = "raisin-server"
path = "src/main.rs"

[features]
default = ["fs", "storage-rocksdb", "websocket", "pgwire", "ai"]
fs = []
s3 = ["raisin-binary/s3", "raisin-transport-http/s3"]
store-memory = ["raisin-transport-http/store-memory", "dep:raisin-storage-memory"]
store-mongo = ["raisin-transport-http/store-mongo"]
storage-rocksdb = ["raisin-transport-http/storage-rocksdb", "dep:raisin-rocksdb", "dep:raisin-replication", "dep:rocksdb", "dep:raisin-indexer", "dep:raisin-hnsw", "dep:raisin-embeddings", "dep:raisin-sql-execution", "dep:raisin-functions"]
websocket = ["dep:raisin-transport-ws"]
# Distributed (Redis-backed) lock backend; in-process backend is always available.
locks-redis = ["raisin-locks/redis"]
pgwire = ["dep:pgwire", "dep:raisin-transport-pgwire", "raisin-transport-pgwire/indexing"]
# AI features (forwarded from raisin-ai)
ai = ["pdf", "pdf-markdown", "candle", "ocr"]
pdf = ["raisin-ai/pdf"]
pdf-markdown = ["raisin-ai/pdf-markdown"]
ocr = ["raisin-ai/ocr"]
candle = ["raisin-ai/candle"]
huggingface = ["raisin-ai/huggingface"]
# Projection tiers for ST_TRANSFORM. See raisin-proj for build costs.
# `proj` is pure Rust and cheap; `proj-full` drags a libproj build.
# `?/` so asking for wider CRS coverage does not silently switch on the
# optional SQL-execution dependency.
proj = ["raisin-sql-execution?/proj"]
proj-full = ["raisin-sql-execution?/proj-full"]

[dev-dependencies]
reqwest = { workspace = true, features = ["json", "multipart"] }
tempfile = "3.8"
chrono = { workspace = true }
tokio-tungstenite = "0.21"
serde_json = { workspace = true }
anyhow = { workspace = true }
zip = "2.2"
tokio-postgres = { version = "0.7.18", features = ["with-serde_json-1"] }
