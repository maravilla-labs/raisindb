[package]
name = "raisin-ai"
version = "0.1.0"
edition = "2021"
description = "AI/LLM provider integration for RaisinDB"
license = "MIT"

[lib]
path = "src/lib.rs"

[features]
default = ["tiktoken-rs", "bedrock"]
tiktoken-rs = ["dep:tiktoken-rs", "text-splitter/tiktoken-rs"]
huggingface = ["dep:hf-hub", "dep:dirs"]
pdf = ["dep:pdf-extract"]
# PDF to markdown using pdf_oxide (pure Rust, includes OCR)
pdf-markdown = ["dep:pdf_oxide"]
# OCR for scanned PDFs/images using Tesseract
ocr = ["dep:tesseract", "dep:tempfile", "dep:raisin-deps"]
# Candle for local AI inference (CLIP, BLIP)
candle = [
    "dep:candle-core",
    "dep:candle-nn",
    "dep:candle-transformers",
    "dep:tokenizers",
    "dep:image",
    "huggingface",
]
# Integration tests that require model downloads (~800MB)
integration-tests = ["candle", "pdf"]
# AWS Bedrock provider (opt-in, requires AWS SDK)
bedrock = ["dep:aws-sdk-bedrockruntime", "dep:aws-sdk-bedrock", "dep:aws-smithy-types"]

[dependencies]
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true, features = ["json"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync", "time", "fs"] }
futures = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
ring = "0.17"
raisin-crypto = { path = "../raisin-crypto" }
base64 = "0.22"
regex = "1"
once_cell = "1"
raisin-error = { path = "../raisin-error" }
jsonschema = "0.37"
text-splitter = "0.29.3"
tiktoken-rs = { version = "0.9", optional = true }
# HuggingFace model management
hf-hub = { version = "0.4", optional = true }
dirs = { version = "5", optional = true }

# PDF processing
pdf-extract = { version = "0.10", optional = true }
pdf_oxide = { version = "0.2", optional = true }
image = { version = "0.25", optional = true }
raisin-binary = { path = "../raisin-binary" }

# Candle for local AI inference (CLIP, BLIP)
# candle lives in the per-target sections at the END of this file — Metal on
# macOS, plain elsewhere. See the note there.
tokenizers = { version = "0.21", optional = true }

# OCR via Tesseract
tesseract = { version = "0.15", optional = true }
tempfile = { version = "3", optional = true }
raisin-deps = { path = "../raisin-deps", optional = true }

# AWS Bedrock
aws-sdk-bedrockruntime = { version = "1", default-features = false, features = ["rt-tokio", "rustls"], optional = true }
aws-sdk-bedrock = { version = "1", default-features = false, features = ["rt-tokio", "rustls"], optional = true }
aws-smithy-types = { version = "1", optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
# A package's processing-rules/*.yaml is written by hand, so the YAML shape is
# part of the contract and is asserted through the real parser (rules/yaml_tests).
serde_yaml = "0.9"
# Same encoder RocksDB persists tenant AI configs with — the back-compat slug
# default has to be exercised through the real path, not only serde_json.
rmp-serde = { workspace = true }
tempfile = "3"
image = "0.25"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# ── Candle, per target ──────────────────────────────────────────────────────
# METAL ON macOS. Without the feature candle has no Metal kernels compiled in,
# `Device::new_metal(0)` always fails, and `select_device(true)` falls back to
# CPU SILENTLY — for a 1.5B text model that is the difference between a usable
# local model and one that spends minutes on a single prompt. The vision models
# never made it obvious, because each runs one small forward.
#
# These must be the LAST sections in the file: everything after a
# `[target.…]` header belongs to it.
[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { version = "0.9", optional = true, features = ["metal"] }
candle-nn = { version = "0.9", optional = true, features = ["metal"] }
candle-transformers = { version = "0.9", optional = true, features = ["metal"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
candle-core = { version = "0.9", optional = true }
candle-nn = { version = "0.9", optional = true }
candle-transformers = { version = "0.9", optional = true }
